<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Countdown | TextNexus</title>
    <meta name="description" content="A live countdown to the next TextNexus game session, synced from the server.">
    <link rel="canonical" href="https://textnexus.me/countdown_timer.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TextNexus">
    <meta property="og:title" content="Game Countdown | TextNexus">
    <meta property="og:description" content="A live countdown to the next TextNexus game session, synced from the server.">
    <meta property="og:url" content="https://textnexus.me/countdown_timer.html">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Game Countdown | TextNexus">
    <meta name="twitter:description" content="A live countdown to the next TextNexus game session, synced from the server.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nxBg: '#050507',
            nxCard: '#111113',
            nxInner: '#0b0b0d',
            nxBorder: '#222226',
            nxBorderHover: '#33333b',
            nxGold: '#f59e0b',
            nxGoldDark: '#d97706',
            nxGreen: '#10b981',
            nxMuted: '#71717a',
            nxSubtext: '#a1a1aa'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #050507;
      color: #ffffff;
    }

    /* Soft glowing effects matching Nexus UI */
    .glow-green {
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    .glow-gold-pill {
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
    }

    .glow-card {
      box-shadow: 0 0 40px -10px rgba(0, 0, 0, 0.8), 0 0 20px -5px rgba(245, 158, 11, 0.05);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 md:p-10 font-sans antialiased selection:bg-nxGold selection:text-black">

  <!-- Header Navigation Bar Style -->
  <header class="w-full max-w-2xl flex items-center justify-between pt-2">
    <!-- Live System Status -->
    <div class="flex items-center space-x-2 bg-nxCard border border-nxBorder px-3.5 py-1.5 rounded-full">
      <span class="w-2.5 h-2.5 rounded-full bg-nxGreen glow-green animate-pulse"></span>
      <span class="text-xs font-mono font-medium text-nxSubtext tracking-wide uppercase">SYSTEM READY</span>
    </div>

    <!-- Announcement Tag Badge -->
    <div class="flex items-center space-x-2">
      <span class="bg-nxGold text-black font-mono font-bold text-[11px] px-3 py-1 rounded-full uppercase tracking-wider glow-gold-pill">
        UPCOMING RELEASE
      </span>
    </div>
  </header>

  <!-- Main Countdown Container -->
  <main class="w-full max-w-2xl my-auto py-8">
    
    <!-- Title & Subtitle Card -->
    <div class="bg-nxCard border border-nxBorder rounded-[16px] p-6 sm:p-8 md:p-10 glow-card space-y-8">
      
      <!-- Brand & Game Launch Heading -->
      <div class="text-center space-y-3">
        <div class="inline-flex items-center justify-center px-3 py-1 rounded-md bg-nxInner border border-nxBorder text-xs font-mono text-nxGold uppercase tracking-widest">
          New Game Launch
        </div>
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight text-white">
          Lofin.dev <span class="text-nxMuted font-light">X</span> Textnexus.me
        </h1>
        <p id="targetSubtitle" class="text-xs sm:text-sm font-mono text-nxMuted pt-1">
          Target Launch: Saturday at 12:00 PM (Noon)
        </p>
      </div>

      <!-- Time Digit Blocks (4 Grid Layout) -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
        
        <!-- Days -->
        <div class="bg-nxInner border border-nxBorder hover:border-nxBorderHover transition-colors rounded-xl p-4 sm:p-5 text-center">
          <div id="days" class="font-mono text-4xl sm:text-5xl font-bold text-white tracking-tight">00</div>
          <div class="text-[10px] sm:text-xs font-mono text-nxMuted uppercase tracking-widest mt-2">Days</div>
        </div>

        <!-- Hours -->
        <div class="bg-nxInner border border-nxBorder hover:border-nxBorderHover transition-colors rounded-xl p-4 sm:p-5 text-center">
          <div id="hours" class="font-mono text-4xl sm:text-5xl font-bold text-white tracking-tight">00</div>
          <div class="text-[10px] sm:text-xs font-mono text-nxMuted uppercase tracking-widest mt-2">Hours</div>
        </div>

        <!-- Minutes -->
        <div class="bg-nxInner border border-nxBorder hover:border-nxBorderHover transition-colors rounded-xl p-4 sm:p-5 text-center">
          <div id="minutes" class="font-mono text-4xl sm:text-5xl font-bold text-white tracking-tight">00</div>
          <div class="text-[10px] sm:text-xs font-mono text-nxMuted uppercase tracking-widest mt-2">Minutes</div>
        </div>

        <!-- Seconds (Amber Accent) -->
        <div class="bg-nxInner border border-nxGold/40 rounded-xl p-4 sm:p-5 text-center" style="background: rgba(245, 158, 11, 0.03);">
          <div id="seconds" class="font-mono text-4xl sm:text-5xl font-bold text-nxGold tracking-tight">00</div>
          <div class="text-[10px] sm:text-xs font-mono text-nxGold/80 uppercase tracking-widest mt-2">Seconds</div>
        </div>

      </div>

      <!-- Progress Line & Status Footer -->
      <div class="space-y-2 pt-2 border-t border-nxBorder/60">
        <div class="flex justify-between items-center text-xs font-mono">
          <span class="text-nxMuted">TIME UNTIL LAUNCH</span>
          <span id="progressPercent" class="text-nxGold font-semibold">0%</span>
        </div>
        <div class="w-full bg-nxInner border border-nxBorder h-2 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-nxGold h-full rounded-full transition-all duration-500 w-0"></div>
        </div>
      </div>

    </div>

  </main>

  <!-- Footer with UTC & Local Clocks -->
  <footer class="w-full max-w-2xl border-t border-nxBorder/40 pt-4 flex flex-col sm:flex-row items-center justify-between text-xs font-mono text-nxMuted gap-2">
    <div class="flex items-center space-x-2">
      <span class="w-1.5 h-1.5 rounded-full bg-nxGreen"></span>
      <span id="localClock">Local Time: --:--:--</span>
    </div>
    <div id="utcClock">--:--:-- UTC</div>
  </footer>

  <!-- Countdown Script -->
  <script>
    // Target calculation: Upcoming Saturday at 12:00 PM (Noon)
    function getUpcomingSaturdayNoon() {
      const now = new Date();
      const target = new Date(now);
      
      const dayOfWeek = now.getDay(); // 0 = Sun, 6 = Sat
      let daysToAdd = (6 - dayOfWeek + 7) % 7;

      // If today is Saturday and past noon, target next Saturday
      if (dayOfWeek === 6) {
        if (now.getHours() >= 12) {
          daysToAdd = 7;
        } else {
          daysToAdd = 0;
        }
      }

      target.setDate(now.getDate() + daysToAdd);
      target.setHours(12, 0, 0, 0); // 12:00:00.000 PM
      return target;
    }

    const startDate = new Date();
    const targetDate = getUpcomingSaturdayNoon();

    // DOM Elements
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const targetSubtitle = document.getElementById('targetSubtitle');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const localClock = document.getElementById('localClock');
    const utcClock = document.getElementById('utcClock');

    // Format target date display
    const dateOptions = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' };
    targetSubtitle.textContent = `Target: ${targetDate.toLocaleDateString(undefined, dateOptions)}`;

    function padZero(n) {
      return n < 10 ? '0' + n : n;
    }

    function updateTimer() {
      const now = new Date();

      // Update real-time clock tickers
      localClock.textContent = `Local: ${now.toLocaleTimeString()}`;
      utcClock.textContent = `${now.toISOString().substring(11, 19)} UTC`;

      const diff = targetDate - now;

      // When countdown reaches or passes target
      if (diff <= 0) {
        daysEl.textContent = '00';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        progressBar.style.width = '100%';
        progressPercent.textContent = '100% (LIVE)';
        return;
      }

      // Calculations
      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      daysEl.textContent = padZero(d);
      hoursEl.textContent = padZero(h);
      minutesEl.textContent = padZero(m);
      secondsEl.textContent = padZero(s);

      // Progress bar percentage
      const totalSpan = targetDate - startDate;
      const elapsed = now - startDate;
      if (totalSpan > 0) {
        const pct = Math.min(Math.max((elapsed / totalSpan) * 100, 0), 100);
        progressBar.style.width = pct.toFixed(1) + '%';
        progressPercent.textContent = pct.toFixed(1) + '%';
      }
    }

    // Initial call & 1s interval loop
    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
