<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Nexus Admin</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main class="shell">
    <header class="bar">
      <div class="brand"><img src="/logo.svg" alt=""><span>Nexus Admin</span></div>
    </header>
    <section class="card">
      <h2>Choose a panel</h2>
      <p class="hint">Each panel has its own owner account. Access is enforced by the database rules.</p>
      <div class="row">
        <a href="textnexus.html"><button>TextNexus</button></a>
        <a href="leo.html"><button>Leo</button></a>
        <a href="javier.html"><button>Javier</button></a>
      </div>
      <p class="note" style="margin-top:18px">
        On <strong>leo.textnexus.me</strong> and <strong>javier.textnexus.me</strong> this page opens the matching panel automatically.
      </p>
    </section>
  </main>
  <script>
    (function () {
      var host = location.hostname.toLowerCase();
      var map = { "leo.textnexus.me": "leo.html", "javier.textnexus.me": "javier.html" };
      if (map[host]) location.replace(map[host]);
    })();
  </script>
</body>
</html>
