    <!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus — Premium Workspace</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        serif: ['"Playfair Display"', 'serif'] 
                    },
                    colors: {
                        sidebar: '#171717',
                        main: '#131313', 
                        borderSubtle: 'rgba(255,255,255,0.06)',
                        brand: 'var(--brand-color)'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            /* Default accent color (Off-white to match image) */
            --brand-color: #e5e5e5;
        }

        body { 
            background-color: #131313; 
            color: #ececec; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }
        
        /* Smooth Intro Screen */
        #intro-screen {
            position: fixed; inset: 0; background-color: #131313; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }
        .intro-logo {
            font-family: 'Playfair Display', serif; font-size: 3rem; color: #fff;
            opacity: 0; transform: scale(0.98);
            animation: elegantFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes elegantFadeIn {
            0% { opacity: 0; transform: scale(0.95); letter-spacing: 0px; }
            100% { opacity: 1; transform: scale(1); letter-spacing: 2px; }
        }

        /* Sidebar Item Animations */
        .nav-btn.active { 
            background-color: rgba(255,255,255,0.08); 
            color: #fff; 
        }
        .nav-btn.active i { 
            color: var(--brand-color); 
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body class="h-screen w-screen flex antialiased selection:bg-brand/30 selection:text-white">

    <!-- Intro Screen -->
    <div id="intro-screen">
        <div class="intro-logo">Nexus</div>
        <div class="mt-6 flex items-center gap-3 text-[10px] text-zinc-500 tracking-[0.2em] uppercase font-medium">
            <span class="w-1.5 h-1.5 rounded-full bg-zinc-400 animate-pulse"></span>
            Initializing Workspace
        </div>
    </div>

    <!-- Main App UI -->
    <div class="w-full h-full flex relative z-10 transition-all duration-1000 opacity-0 scale-[0.99]" id="app-container">
        
        <!-- Sidebar (Matching the flat, clean look of the image) -->
        <aside class="w-[260px] h-full flex flex-col bg-sidebar border-r border-borderSubtle shrink-0 select-none z-20 transition-all duration-300 relative">
            
            <!-- Header Logo -->
            <div class="h-[60px] flex items-center justify-between px-4 shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-4 h-4 bg-white rounded-sm rotate-45 flex items-center justify-center scale-90">
                        <div class="w-2.5 h-2.5 bg-sidebar rounded-sm"></div>
                    </div>
                    <span class="font-serif text-lg tracking-wide text-white">Nexus</span>
                </div>
                <button class="text-zinc-500 hover:text-white transition"><i class="ph ph-sidebar-simple text-lg"></i></button>
            </div>

            <!-- New Action Button -->
            <div class="px-3 mt-1">
                <button onclick="switchTab('home', document.getElementById('nav-home'))" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl border border-white/10 hover:bg-white/5 text-zinc-300 text-sm font-medium transition shadow-sm">
                    <i class="ph ph-pencil-simple text-base"></i> New Chat
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-3 py-6 flex flex-col gap-1 overflow-y-auto">
                
                <!-- Search Bar within Sidebar -->
                <div class="flex items-center gap-2.5 px-3 py-2 rounded-lg border border-white/5 bg-black/20 text-zinc-400 text-sm mb-4 focus-within:border-white/20 focus-within:text-zinc-200 transition">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" placeholder="Search chats..." class="bg-transparent border-none focus:outline-none w-full text-white placeholder:text-zinc-600 font-light">
                </div>

                <div class="px-2 mb-1 mt-2 text-[10px] font-semibold tracking-widest text-zinc-500 uppercase flex justify-between items-center">
                    Pages
                    <button class="hover:text-white transition"><i class="ph ph-plus text-xs"></i></button>
                </div>
                
                <button id="nav-home" onclick="switchTab('home', this)" class="nav-btn active flex items-center gap-3 px-2 py-2.5 rounded-lg text-zinc-400 hover:text-zinc-200 hover:bg-white/5 transition-all text-sm font-medium text-left">
                    <i class="ph ph-chat-circle text-lg w-5 text-center"></i> <span class="truncate flex-1">Home Dashboard</span>
                </button>
                <button onclick="switchTab('youtube', this)" class="nav-btn flex items-center gap-3 px-2 py-2.5 rounded-lg text-zinc-400 hover:text-zinc-200 hover:bg-white/5 transition-all text-sm font-medium text-left">
                    <i class="ph ph-youtube-logo text-lg w-5 text-center"></i> <span class="truncate flex-1">Media Hub</span>
                </button>
                <button onclick="switchTab('ghostlink', this)" class="nav-btn flex items-center gap-3 px-2 py-2.5 rounded-lg text-zinc-400 hover:text-zinc-200 hover:bg-white/5 transition-all text-sm font-medium text-left">
                    <i class="ph ph-ghost text-lg w-5 text-center"></i> <span class="truncate flex-1">Ghostlink</span>
                </button>
            </nav>

            <!-- Bottom Profile & Settings Area -->
            <div class="p-3 flex flex-col gap-1 border-t border-borderSubtle bg-sidebar">
                <button id="settings-trigger" class="flex items-center gap-3 px-2 py-2.5 rounded-lg hover:bg-white/5 transition text-left text-zinc-300 text-sm font-medium w-full">
                    <div class="w-6 h-6 rounded-full bg-zinc-800 flex items-center justify-center overflow-hidden shrink-0 border border-white/10">
                        <i id="user-avatar-icon" class="ph ph-user text-xs"></i>
                        <img id="user-avatar-img" src="" class="w-full h-full object-cover hidden">
                    </div>
                    <span id="user-name-label" class="truncate flex-1 text-xs">Sign In / Auth</span>
                    <i class="ph ph-sign-out text-zinc-500 text-xs"></i>
                </button>

                <button class="flex items-center gap-3 px-2 py-2.5 rounded-lg hover:bg-white/5 transition text-left text-zinc-400 hover:text-zinc-200 text-sm font-medium w-full mt-2">
                    <i class="ph ph-list w-6 text-center text-lg"></i> More
                </button>
                <button onclick="openSettings()" class="flex items-center gap-3 px-2 py-2.5 rounded-lg hover:bg-white/5 transition text-left text-zinc-400 hover:text-zinc-200 text-sm font-medium w-full">
                    <i class="ph ph-gear w-6 text-center text-lg"></i> Settings
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-full relative z-10 bg-main">
            
            <!-- Native Home View (Matches Image) -->
            <div id="home-view" class="flex flex-col h-full w-full">
                
                <!-- Top Dropdown Header -->
                <header class="h-[60px] shrink-0 flex items-center px-4 gap-4 w-full">
                    <button class="flex items-center gap-2 text-sm text-zinc-300 hover:text-white px-3 py-1.5 rounded-lg hover:bg-white/5 transition font-medium">
                        <i class="ph ph-chat-circle text-lg"></i> Direct <i class="ph ph-caret-down text-xs text-zinc-500"></i>
                    </button>
                    
                    <div class="h-4 w-px bg-borderSubtle"></div>
                    
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 border border-white/5 text-sm text-zinc-300 cursor-pointer hover:bg-white/10 transition">
                        <i class="ph ph-cpu text-[var(--brand-color)]"></i> 
                        Model 
                        <span class="text-xs font-semibold px-1.5 py-0.5 rounded ml-1 bg-white/10 text-zinc-300 flex items-center gap-1">
                            <i class="ph ph-eye text-[var(--brand-color)]"></i> Vision
                        </span> 
                        <i class="ph ph-caret-down text-xs ml-1 text-zinc-500"></i>
                    </div>
                </header>

                <!-- Center Prompt Grid -->
                <div class="flex-1 flex flex-col items-center justify-center max-w-3xl mx-auto w-full px-6 py-10 overflow-y-auto">
                    <h1 class="text-4xl md:text-5xl font-serif text-white mb-10 text-center tracking-tight font-light">What would you like to do?</h1>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
                        <!-- Cards -->
                        <button class="flex flex-col text-left p-4 rounded-xl border border-borderSubtle bg-transparent hover:bg-white/5 transition-colors gap-1.5 group">
                           <div class="flex items-center gap-2 text-zinc-200">
                               <i class="ph ph-layout text-lg text-zinc-400 group-hover:text-[var(--brand-color)] transition-colors"></i> 
                               <span class="font-medium text-sm">Create a landing page</span>
                           </div>
                           <span class="text-xs text-zinc-500 ml-7">Sleek, modern landing page copy</span>
                        </button>
                        
                        <button class="flex flex-col text-left p-4 rounded-xl border border-borderSubtle bg-transparent hover:bg-white/5 transition-colors gap-1.5 group">
                           <div class="flex items-center gap-2 text-zinc-200">
                               <i class="ph ph-chart-bar text-lg text-zinc-400 group-hover:text-[var(--brand-color)] transition-colors"></i> 
                               <span class="font-medium text-sm">Build a dashboard</span>
                           </div>
                           <span class="text-xs text-zinc-500 ml-7">Turn data into a plan</span>
                        </button>
                        
                        <button class="flex flex-col text-left p-4 rounded-xl border border-borderSubtle bg-transparent hover:bg-white/5 transition-colors gap-1.5 group">
                           <div class="flex items-center gap-2 text-zinc-200">
                               <i class="ph ph-game-controller text-lg text-zinc-400 group-hover:text-[var(--brand-color)] transition-colors"></i> 
                               <span class="font-medium text-sm">Make a game</span>
                           </div>
                           <span class="text-xs text-zinc-500 ml-7">Brainstorm a browser game</span>
                        </button>
                        
                        <button class="flex flex-col text-left p-4 rounded-xl border border-borderSubtle bg-transparent hover:bg-white/5 transition-colors gap-1.5 group">
                           <div class="flex items-center gap-2 text-zinc-200">
                               <i class="ph ph-code text-lg text-zinc-400 group-hover:text-[var(--brand-color)] transition-colors"></i> 
                               <span class="font-medium text-sm">Explain some code</span>
                           </div>
                           <span class="text-xs text-zinc-500 ml-7">Paste code, get a walkthrough</span>
                        </button>
                    </div>
                </div>

                <!-- Bottom Sticky Input -->
                <div class="p-6 w-full max-w-3xl mx-auto shrink-0 pb-8">
                    <div class="bg-[#1f1f1f] border border-white/5 rounded-2xl p-3 flex flex-col gap-2 shadow-2xl">
                        <input type="text" placeholder="Ask anything..." class="bg-transparent border-none text-zinc-200 text-base focus:outline-none w-full p-2 placeholder:text-zinc-600 font-light">
                        <div class="flex items-center justify-between px-2">
                            <div class="flex gap-4 text-zinc-400 text-sm font-medium">
                                <button class="flex items-center gap-1.5 hover:text-white transition"><i class="ph ph-paperclip text-lg"></i> Add files</button>
                                <button class="flex items-center gap-1.5 hover:text-white transition"><i class="ph ph-code text-lg"></i> Code</button>
                                <button class="flex items-center gap-1.5 hover:text-white transition"><i class="ph ph-microphone text-lg"></i> Voice</button>
                            </div>
                            <button class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition group">
                                <i class="ph ph-arrow-up group-hover:-translate-y-0.5 transition-transform text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Iframe Container for External Pages -->
            <iframe id="content-frame" class="w-full h-full border-none bg-transparent hidden" src=""></iframe>
        </main>
    </div>

    <!-- Settings Modal (Accent Color) -->
    <div id="settings-modal" class="fixed inset-0 z-[9998] bg-black/60 backdrop-blur-sm flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-sidebar border border-borderSubtle rounded-2xl w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-300" id="settings-box">
            <div class="flex items-center justify-between px-5 py-4 border-b border-white/5">
                <h3 class="text-white font-medium text-lg">Appearance Settings</h3>
                <button onclick="closeSettings()" class="text-zinc-500 hover:text-white transition"><i class="ph ph-x text-lg"></i></button>
            </div>
            <div class="p-5 flex flex-col gap-4">
                <div>
                    <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3 block">Accent Color</label>
                    <div class="flex items-center gap-3">
                        <button onclick="setThemeColor('#e5e5e5')" class="w-8 h-8 rounded-full bg-[#e5e5e5] border-2 border-transparent focus:border-zinc-500 hover:scale-110 transition-transform"></button>
                        <button onclick="setThemeColor('#10b981')" class="w-8 h-8 rounded-full bg-emerald-500 border-2 border-transparent focus:border-zinc-500 hover:scale-110 transition-transform"></button>
                        <button onclick="setThemeColor('#3b82f6')" class="w-8 h-8 rounded-full bg-blue-500 border-2 border-transparent focus:border-zinc-500 hover:scale-110 transition-transform"></button>
                        <button onclick="setThemeColor('#a855f7')" class="w-8 h-8 rounded-full bg-purple-500 border-2 border-transparent focus:border-zinc-500 hover:scale-110 transition-transform"></button>
                        <button onclick="setThemeColor('#f43f5e')" class="w-8 h-8 rounded-full bg-rose-500 border-2 border-transparent focus:border-zinc-500 hover:scale-110 transition-transform"></button>
                    </div>
                </div>
            </div>
            <div class="px-5 py-4 border-t border-white/5 flex justify-end">
                <button onclick="closeSettings()" class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/15 text-white text-sm font-medium transition">Done</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Firebase Config
        const app = initializeApp({
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
        });
        const auth = getAuth(app);

        // Initialization & Theme Load
        window.addEventListener('load', () => {
            // Load saved accent color
            const savedColor = localStorage.getItem('nexus-brand-color');
            if(savedColor) document.documentElement.style.setProperty('--brand-color', savedColor);

            // Intro Animation Sequence
            setTimeout(() => {
                const intro = document.getElementById('intro-screen');
                const appCont = document.getElementById('app-container');
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                    appCont.style.opacity = '1';
                    appCont.style.transform = 'scale(1)';
                }, 800);
            }, 1800);
        });

        // Tab Switching Logic (Handles native home view vs iframes)
        window.switchTab = (page, btn) => {
            // Update active state in sidebar
            if(btn) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            
            const homeView = document.getElementById('home-view');
            const iframeView = document.getElementById('content-frame');
            
            if (page === 'home') {
                homeView.style.display = 'flex';
                iframeView.style.display = 'none';
                iframeView.src = '';
            } else {
                homeView.style.display = 'none';
                iframeView.style.display = 'block';

                if (page === 'youtube') {
                    iframeView.removeAttribute('src');
                    iframeView.srcdoc = `
                        <html class="dark"><head><script src="https://cdn.tailwindcss.com"><\/script></head>
                        <body class="bg-[#131313] text-white p-10 font-sans">
                            <div class="max-w-5xl mx-auto mt-6">
                                <h1 class="text-4xl font-serif mb-2 tracking-tight">Media Hub</h1>
                                <p class="text-zinc-500 mb-10 text-sm">Curated platform access.</p>
                                <div class="grid grid-cols-1 gap-8">
                                    <div class="p-2 rounded-2xl border border-white/10 bg-[#1a1a1a]">
                                        <div class="aspect-video bg-black rounded-xl overflow-hidden shadow-inner">
                                            <iframe class="w-full h-full border-none" src="https://www.youtube.com/embed/9qbrOrj30TM" allowfullscreen></iframe>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </body></html>
                    `;
                } else {
                    iframeView.removeAttribute('srcdoc');
                    iframeView.src = page + '.html';
                }
            }
        };

        // Theme Settings Logic
        const settingsModal = document.getElementById('settings-modal');
        const settingsBox = document.getElementById('settings-box');
        
        window.openSettings = () => {
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            settingsBox.classList.remove('scale-95');
        };
        
        window.closeSettings = () => {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            settingsBox.classList.add('scale-95');
        };

        window.setThemeColor = (colorHex) => {
            document.documentElement.style.setProperty('--brand-color', colorHex);
            localStorage.setItem('nexus-brand-color', colorHex);
            showToast('Theme accent updated');
        };

        // Close modal on outside click
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeSettings();
        });

        // Toast Notifications
        window.showToast = (msg) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-[#1e1e1e] border border-white/10 px-4 py-3 rounded-xl text-white text-sm shadow-xl flex items-center gap-3 transform translate-y-8 opacity-0 transition-all duration-300';
            toast.innerHTML = `<i class="ph ph-check-circle text-[var(--brand-color)] text-lg"></i> <span class="font-medium">${msg}</span>`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => toast.classList.remove('translate-y-8', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-8', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // Auth Logic
        document.getElementById('settings-trigger').addEventListener('click', async () => {
            if (auth.currentUser) {
                await signOut(auth);
                showToast("Logged out successfully");
            } else {
                try {
                    await signInWithPopup(auth, new GoogleAuthProvider());
                    showToast("Authentication successful");
                } catch (err) { }
            }
        });

        onAuthStateChanged(auth, (user) => {
            const icon = document.getElementById('user-avatar-icon');
            const img = document.getElementById('user-avatar-img');
            const label = document.getElementById('user-name-label');
            
            if (user) {
                icon.classList.add('hidden');
                img.classList.remove('hidden');
                img.src = user.photoURL || 'https://placehold.co/100';
                label.textContent = user.displayName?.split(' ')[0] || 'User';
            } else {
                icon.classList.remove('hidden');
                img.classList.add('hidden');
                label.textContent = 'Sign In / Auth';
            }
        });
    </script>
</body>
</html>
