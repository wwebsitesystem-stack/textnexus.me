    <style>
        :root {
            /* Luxury Dark Palette */
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --glass-panel: rgba(10, 10, 10, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.12);
            
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-tertiary: #555555;
            
            --accent-primary: #ffffff;
            --accent-gold: #ffd700;
            
            --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

            /* Ultra-smooth modern easing */
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out-circ: cubic-bezier(0.85, 0, 0.15, 1);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            user-select: none; -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex;
            perspective: 1000px;
        }

        /* =========================================
           ULTRA-MODERN BOOT SEQUENCE STYLES
        ========================================= */
        #boot-screen {
            position: fixed; inset: 0;
            background: #000; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
            transition: opacity 1.2s var(--ease-out-expo), transform 1.2s var(--ease-out-expo), filter 1.2s var(--ease-out-expo);
        }

        /* Ambient glowing orbs in the background */
        .boot-ambient {
            position: absolute; inset: 0; z-index: 1; pointer-events: none;
            overflow: hidden; filter: blur(80px); opacity: 0.6;
        }
        .boot-orb {
            position: absolute; border-radius: 50%;
            animation: float 10s ease-in-out infinite alternate;
        }
        .orb-1 { width: 40vw; height: 40vw; background: rgba(59, 130, 246, 0.15); top: -10%; left: -10%; animation-delay: 0s; }
        .orb-2 { width: 50vw; height: 50vw; background: rgba(139, 92, 246, 0.15); bottom: -20%; right: -10%; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.1); }
        }

        .boot-content {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 600px;
        }

        /* Detailed SVG Drawing Animation */
        .boot-logo-wrapper {
            position: relative; width: 120px; height: 120px; margin-bottom: 40px;
        }
        .boot-logo-svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
        }
        .path-main {
            stroke-dasharray: 400; stroke-dashoffset: 400;
            animation: drawPath 2.5s var(--ease-in-out-circ) forwards;
        }
        .path-pulse {
            transform-origin: center;
            animation: pulsePath 3s infinite ease-in-out;
        }

        @keyframes drawPath {
            0% { stroke-dashoffset: 400; fill: rgba(255,255,255,0); }
            80% { stroke-dashoffset: 0; fill: rgba(255,255,255,0); }
            100% { stroke-dashoffset: 0; fill: rgba(255,255,255,0.05); }
        }
        @keyframes pulsePath {
            0%, 100% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* Modern Shimmering Typography */
        .boot-title {
            font-size: 24px; font-weight: 300; letter-spacing: 12px;
            text-transform: uppercase; margin-bottom: 8px; margin-left: 12px; /* Offset for letter spacing */
            background: linear-gradient(90deg, #555 0%, #fff 50%, #555 100%);
            background-size: 200% auto;
            color: transparent; -webkit-background-clip: text; background-clip: text;
            animation: shimmerText 3s linear infinite, fadeUp 1s var(--ease-out-expo) forwards;
            opacity: 0; transform: translateY(20px);
        }
        
        .boot-subtitle {
            font-family: var(--font-mono); font-size: 10px; font-weight: 500;
            color: var(--text-tertiary); letter-spacing: 4px;
            opacity: 0; transform: translateY(10px);
            animation: fadeUp 1s var(--ease-out-expo) 0.3s forwards;
        }

        @keyframes shimmerText { to { background-position: 200% center; } }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        /* Sleek Progress Bar & Data */
        .boot-loader-container {

            display: flex; flex-direction: column; gap: 12px;
            opacity: 0; animation: fadeUp 1s var(--ease-out-expo) 0.6s forwards;

        .modal-btn-group { display:flex; gap:10px; justify-content:center; }
        .btn-secondary { flex:1; padding:10px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#fff; cursor:pointer; font-size:12px; font-weight: 500; }
        .btn-primary { flex:1; padding:10px; background:#fff; border:none; border-radius:10px; color:#000; font-weight:600; cursor:pointer; font-size:12px; }

        /* SOCIAL MEDIA STYLES */
        .social-item {
            transition: all 0.2s ease;
        }
        .social-item:hover {
            background: var(--glass-hover);
            color: #fff;
        }
        .coming-soon-badge {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            background: rgba(255, 215, 0, 0.2);
            color: var(--accent-gold);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            margin-left: auto;
        }

        /* =========================================
           STATUS SPLASH SCREEN (Post-Boot Message)
        ========================================= */
        #status-splash {
            position: fixed; inset: 0;
            background: #000; z-index: 99998;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 1s var(--ease-out-expo);
        }
        #status-splash.splash-visible {
            opacity: 1; pointer-events: auto;
        }
        #status-splash.splash-hidden {
            opacity: 0; filter: blur(30px); transform: scale(1.1); pointer-events: none;
        }

        .splash-ambient {
            position: absolute; inset: 0; z-index: 1; pointer-events: none;
            overflow: hidden; filter: blur(100px); opacity: 0.4;
        }
        .splash-orb {
            position: absolute; border-radius: 50%;
            animation: float 12s ease-in-out infinite alternate;
        }
        .splash-orb-1 { width: 45vw; height: 45vw; background: rgba(139, 92, 246, 0.2); top: -15%; right: -10%; animation-delay: -2s; }
        .splash-orb-2 { width: 35vw; height: 35vw; background: rgba(59, 130, 246, 0.15); bottom: -10%; left: -5%; animation-delay: -7s; }

        .splash-content {
            position: relative; z-index: 10;
            width: 100%; max-width: 520px;
            display: flex; flex-direction: column; align-items: center;
            text-align: center;
            background: var(--glass-panel);
            backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            opacity: 0; transform: translateY(20px) scale(0.98);
            transition: opacity 0.8s var(--ease-out-expo) 0.3s, transform 0.8s var(--ease-out-expo) 0.3s;
        }
        #status-splash.splash-visible .splash-content {
            opacity: 1; transform: translateY(0) scale(1);
        }

        .splash-icon {
            width: 56px; height: 56px; border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 28px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }
        .splash-icon svg { width: 26px; height: 26px; stroke: var(--text-primary); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

        .splash-title {
            font-size: 18px; font-weight: 600; letter-spacing: 0.5px;
            color: #fff; margin-bottom: 16px; line-height: 1.5;
        }

        .splash-message {
            font-size: 14px; font-weight: 400; line-height: 1.7;
            color: var(--text-secondary); margin-bottom: 32px;
        }

        .splash-link {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--font-mono); font-size: 12px; font-weight: 500;
            color: #fff; text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            padding: 10px 20px; border-radius: 12px;
            transition: all 0.2s ease;
        }
        .splash-link:hover {
            background: var(--glass-hover);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }
        .splash-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .splash-footer {
            margin-top: 32px;
            font-family: var(--font-mono); font-size: 10px;
            color: var(--text-tertiary); letter-spacing: 2px;
            text-transform: uppercase;
        }

        .splash-progress {
            width: 120px; height: 2px; background: rgba(255,255,255,0.1);
            border-radius: 2px; overflow: hidden; margin-top: 24px;
        }
        .splash-progress-fill {
            height: 100%; width: 0%; background: #fff;
            box-shadow: 0 0 8px #fff;
            animation: splashTimer 6s linear forwards;
        }
        @keyframes splashTimer {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ULTRA MODERN BOOT SEQUENCE -->
    <div id="boot-screen">
        <div class="boot-ambient">
            <div class="boot-orb orb-1"></div>
            <div class="boot-orb orb-2"></div>
        </div>

        <div class="boot-content">
            <!-- Modern Abstract Geometric Nexus Logo -->
            <div class="boot-logo-wrapper">
                <svg class="boot-logo-svg" viewBox="0 0 100 100" fill="none">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="100%" stop-color="rgba(255,255,255,0.2)"/>
                        </linearGradient>
                    </defs>
                    <!-- Outer rotating ring -->
                    <circle cx="50" cy="50" r="45" stroke="rgba(255,255,255,0.1)" stroke-width="1" class="path-pulse" stroke-dasharray="2 6"/>
                    <!-- Inner structural diamond -->
                    <path class="path-main" d="M50 10 L90 50 L50 90 L10 50 Z" stroke="url(#logoGrad)" stroke-width="2" stroke-linejoin="round"/>
                    <path class="path-main" d="M30 30 L70 70 M30 70 L70 30" stroke="url(#logoGrad)" stroke-width="1.5"/>
                    <circle cx="50" cy="50" r="8" fill="#fff" class="path-pulse"/>
                </svg>
            </div>

            <h1 class="boot-title">Nexus // Edition X</h1>
            <div class="boot-subtitle">OS V6.0</div>

            <div class="boot-loader-container">
                <div class="boot-status-row">
                    <span class="boot-log-text" id="boot-status-text">Waking core systems...</span>
                    <span id="boot-percent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="boot-progress-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- POST-BOOT STATUS SPLASH -->
    <div id="status-splash">
        <div class="splash-ambient">
            <div class="splash-orb splash-orb-1"></div>
            <div class="splash-orb splash-orb-2"></div>
        </div>
        <div class="splash-content">
            <div class="splash-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div class="splash-progress">
                <div class="splash-progress-fill" id="splash-progress-fill"></div>
            </div>
            <div class="splash-footer">TextNexus // Status Update</div>
        </div>
    </div>

    <!-- HUMAN VERIFICATION GATE -->
    <div id="turnstile-gate">
        <div class="gate-panel">
            <div class="gate-icon">
                <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
            </div>
            <div class="gate-title">Verify You're Human</div>
            <div class="gate-subtitle">Confirm you're not a bot to continue to Nexus OS.</div>
            <div class="gate-widget-slot">
                <div id="turnstile-widget"></div>
            </div>
            <div class="gate-status" id="gate-status-text"></div>
            <button class="gate-retry-btn" id="gate-retry-btn" onclick="retryTurnstile()">Try Again</button>
        </div>
    </div>

    <!-- AMBIENT MESH BACKGROUND -->
    <div class="ambient-mesh"></div>

    <!-- MAIN OS LAYOUT -->
    <div class="app-layout" id="app-root">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <div class="brand-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <div class="brand-text">
                        <h1>Nexus</h1>
                        <span>OS // EDITION X // v6.0</span>
                    </div>
                </div>

                <div class="nav-group">
                    <div class="nav-label">Workspace</div>
                    <a class="nav-item active" href="home.html" onclick="return loadRoute('home.html', this)">
                        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                        Overview
                    </a>
                    <a class="nav-item" href="updates.html" onclick="return loadRoute('updates.html', this)">
                        <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        Updates
                    </a>
                    <a class="nav-item" href="ghostlink.html" onclick="return loadRoute('ghostlink.html', this)">
                        <svg viewBox="0 0 24 24"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="6.5"/></svg>
                        Ghostlink
                    </a>
                    <a class="nav-item" href="TextNexus.html" onclick="return loadRoute('TextNexus.html', this)">
                        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        TextNexus
                    </a>
                    <a class="nav-item" href="feedback.html" onclick="return loadRoute('feedback.html', this)">
                        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
                        Feedback
                    </a>
                </div>

            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-area">
            <header class="top-hud">
                <div class="cmd-button" onclick="toggleCommandPalette()">
                    <span>Search commands...</span>
                    <span class="cmd-kbd">⌘K</span>
                </div>
                <div class="hud-right">
                    <div class="system-time">
                        <span class="pulse-dot"></span>
                        <span id="hud-clock">00:00:00</span>
                    </div>
                </div>
            </header>

            <div class="iframe-wrapper">
                <iframe id="nexus-viewport" src="home.html" title="Nexus Workspace Viewport"></iframe>
            </div>
        </main>
    </div>

    <!-- COMMAND PALETTE OVERLAY -->
    <div id="cmd-overlay">
        <div class="cmd-modal">
            <div class="cmd-input-area">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="cmd-input" id="cmd-input" placeholder="Type a command or search..." autocomplete="off">
            </div>
            <div class="cmd-results" id="cmd-results"></div>
        </div>
    </div>

    <script>
        // Clock logic
        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById('hud-clock');
            if (clockEl) {
                clockEl.textContent = now.toLocaleTimeString('en-US', { hour12: false });
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Route loader
        function loadRoute(route, el) {
            const iframe = document.getElementById('nexus-viewport');
            if (iframe) {
                iframe.classList.add('loading');
                setTimeout(() => {
                    iframe.src = route;
                    iframe.onload = () => iframe.classList.remove('loading');
                }, 300);
            }
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if (el) el.classList.add('active');
            return false;
        }

        // Command palette stub
        function toggleCommandPalette() {
            const overlay = document.getElementById('cmd-overlay');
            if (overlay) {
                overlay.style.display = 'flex';
                setTimeout(() => overlay.classList.add('active'), 10);
                
                const input = document.getElementById('cmd-input');
                if (input) {
                    input.value = '';
                    input.focus();
                }
            }
        }

        // Close command palette on Escape or clicking outside
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const overlay = document.getElementById('cmd-overlay');
                if (overlay && overlay.classList.contains('active')) {
                    overlay.classList.remove('active');
                    setTimeout(() => overlay.style.display = 'none', 200);
                }
            }
            // Cmd/Ctrl + K shortcut
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                toggleCommandPalette();
            }
        });

        document.getElementById('cmd-overlay')?.addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                e.currentTarget.classList.remove('active');
                setTimeout(() => e.currentTarget.style.display = 'none', 200);
            }
        });
    </script>

<!-- Announcement bar: text comes from system/announcement -->
<div id="tn-announce" hidden style="position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 44px 9px 16px;background:#fff;color:#000;font:600 13px/1.4 'Inter',-apple-system,sans-serif;text-align:center">
  <span id="tn-announce-text"></span>
  <a id="tn-announce-link" href="/updates.html" style="color:#000;text-decoration:underline">Learn more</a>
  <button id="tn-announce-close" aria-label="Dismiss" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:17px;line-height:1;cursor:pointer;color:#000">×</button>
</div>
<script type="module">
  (async () => {
    const bar = document.getElementById('tn-announce');
    if (!bar || sessionStorage.getItem('tn-announce-dismissed') === '1') return;
    const show = (text, link) => {
      if (!text) return;
      document.getElementById('tn-announce-text').textContent = text;
      if (link) document.getElementById('tn-announce-link').href = link;
      bar.hidden = false;
    };
    show('A new version of Nexus is coming out tonight.', '/updates.html');
    try {
      const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
      const { getDatabase, ref, onValue } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js');
      const app = getApps().length ? getApps()[0] : initializeApp({
        apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
        authDomain: "nexus-web-development-official.firebaseapp.com",
        projectId: "nexus-web-development-official",
        databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com"
      });
      onValue(ref(getDatabase(app), 'system/announcement'), (snap) => {
        const a = snap.val();
        if (!a) return;
        if (a.enabled === false) { bar.hidden = true; return; }
        show(a.text || 'A new version of Nexus is coming out tonight.', a.link || '/updates.html');
      });
    } catch { /* rules unpublished: keep the default banner */ }
    document.getElementById('tn-announce-close').addEventListener('click', () => {
      bar.hidden = true;
      sessionStorage.setItem('tn-announce-dismissed', '1');
    });
    document.body.style.paddingTop = bar.offsetHeight + 'px';
  })();
</script>
</body>
</html>
