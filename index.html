<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#0a0a0a',
                        surface: '#121212',
                        surfaceHover: '#1c1c1c',
                        border: '#262626',
                        textMain: '#ededed',
                        textMuted: '#a1a1aa',
                        brand: 'var(--brand-color)'
                    }
                }
            }
        }
    </script>

    <style>
        :root { --brand-color: #ededed; }
        body { background-color: #0a0a0a; color: #ededed; font-family: 'Inter', sans-serif; overflow: hidden; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .intro-content { animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .nav-btn.active { background-color: #1c1c1c; color: #ededed; }
        .nav-btn.active i { color: var(--brand-color); }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        
        /* Toast Animation */
        @keyframes toastSlide {
            0% { transform: translateX(100%); opacity: 0; }
            10% { transform: translateX(0); opacity: 1; }
            90% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }
        .toast-notify { animation: toastSlide 4s forwards cubic-bezier(0.16, 1, 0.3, 1); }
    </style>

    <!-- Dynamic Theme Stylesheet Tag -->
    <link id="theme-stylesheet" rel="stylesheet" href="">
</head>
<body class="h-screen w-screen flex antialiased selection:bg-brand/20 selection:text-white">

    <!-- Intro Screen -->
    <div id="intro-screen" class="fixed inset-0 z-[100] bg-background flex items-center justify-center transition-opacity duration-700 ease-in-out">
        <div class="intro-content flex items-center gap-4">
            <div class="w-7 h-7 rounded-[5px] rotate-45 bg-textMain flex items-center justify-center"><div class="w-3 h-3 bg-background rounded-[2px]"></div></div>
            <span class="font-medium text-2xl tracking-wide text-textMain mt-1">Nexus</span>
        </div>
    </div>

    <!-- App Layout -->
    <div id="app-container" class="w-full h-full flex opacity-0 transition-opacity duration-700 ease-out">
        
        <!-- Sidebar -->
        <aside class="w-64 lg:w-72 h-full flex flex-col bg-surface border-r border-border shrink-0 select-none">
            <div class="h-16 flex items-center px-6 shrink-0 border-b border-border">
                <div class="flex items-center gap-3">
                    <div class="w-4 h-4 rounded-[3px] rotate-45 bg-textMain flex items-center justify-center"><div class="w-1.5 h-1.5 bg-surface rounded-[1px]"></div></div>
                    <span class="font-medium text-sm tracking-wide text-textMain mt-0.5">Nexus</span>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 px-3 py-5 flex flex-col gap-1 overflow-y-auto">
                <p class="px-3 mb-2 text-[11px] font-semibold tracking-wider text-textMuted uppercase">Workspace</p>
                <button onclick="switchTab('home', this)" class="nav-btn active flex items-center gap-3 px-3 py-2 rounded-lg text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors text-sm font-medium"><i class="ph ph-house text-lg"></i> Overview</button>
                <button onclick="switchTab('updates', this)" class="nav-btn flex items-center gap-3 px-3 py-2 rounded-lg text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors text-sm font-medium"><i class="ph ph-bell text-lg"></i> Updates</button>
                <button onclick="switchTab('ghostlink', this)" class="nav-btn flex items-center gap-3 px-3 py-2 rounded-lg text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors text-sm font-medium"><i class="ph ph-ghost text-lg"></i> Ghostlink</button>
                <button onclick="switchTab('suggestions', this)" class="nav-btn flex items-center gap-3 px-3 py-2 rounded-lg text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors text-sm font-medium"><i class="ph ph-note text-lg"></i> Suggestions</button>
                <button onclick="switchTab('creator', this)" class="nav-btn flex items-center gap-3 px-3 py-2 rounded-lg text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors text-sm font-medium"><i class="ph ph-magic-wand text-lg"></i> AI Creator</button>
                
                <p class="px-3 mt-4 mb-2 text-[11px] font-semibold tracking-wider text-textMuted uppercase">Communication</p>
                <button onclick="switchTab('TextNexus', this)" class="nav-btn flex items-center justify-between px-3 py-2 rounded-lg text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors text-sm font-medium group">
                    <div class="flex items-center gap-3"><i class="ph ph-chat-teardrop-text text-lg"></i> TextNexus</div>
                </button>
                <button onclick="switchTab('notifications', this)" class="nav-btn flex items-center justify-between px-3 py-2 rounded-lg text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors text-sm font-medium" id="nav-notifications">
                    <div class="flex items-center gap-3"><i class="ph ph-tray text-lg"></i> Notifications</div>
                </button>
            </nav>

            <!-- Footer (Auth & Settings) -->
            <div class="p-3 flex flex-col gap-1 border-t border-border">
                <button id="auth-trigger" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-surfaceHover transition-colors text-left text-textMuted text-sm font-medium w-full group">
                    <div class="w-6 h-6 rounded-full bg-border flex items-center justify-center overflow-hidden shrink-0">
                        <i id="user-avatar-icon" class="ph ph-user text-xs text-textMuted"></i>
                        <img id="user-avatar-img" src="" class="w-full h-full object-cover hidden">
                    </div>
                    <span id="user-name-label" class="truncate flex-1">Log In</span>
                </button>
                <button onclick="switchTab('admin', this)" class="nav-btn flex items-center gap-3 px-3 py-2 rounded-lg text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors text-sm font-medium w-full"><i class="ph ph-shield-check text-lg"></i> Admin Panel</button>
                <button onclick="openSettings()" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-surfaceHover transition-colors text-textMuted hover:text-textMain text-sm font-medium w-full"><i class="ph ph-gear text-lg"></i> Settings</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 h-full relative bg-background">
            <iframe id="content-frame" class="w-full h-full border-none bg-transparent" src="home.html"></iframe>
        </main>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref as dbRef, onChildAdded, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const app = initializeApp({
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com" 
        });
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Realtime Database Theme Listener (system/theme)
        const themeStylesheet = document.getElementById('theme-stylesheet');
        const themeRef = dbRef(db, 'system/theme');

        onValue(themeRef, (snapshot) => {
            const themeVal = snapshot.val();
            if (themeVal && themeVal !== 'default' && themeVal !== 'none') {
                let themePath = themeVal.trim();
                if (!themePath.endsWith('.css')) themePath = `themes/${themePath}.css`;
                else if (!themePath.startsWith('themes/')) themePath = `themes/${themePath}`;
                themeStylesheet.href = themePath;
            } else {
                themeStylesheet.href = '';
            }
        });

        // UI Initialization
        window.addEventListener('load', () => {
            const savedColor = localStorage.getItem('nexus-brand-color');
            if(savedColor) document.documentElement.style.setProperty('--brand-color', savedColor);
            setTimeout(() => {
                document.getElementById('intro-screen').style.opacity = '0';
                document.getElementById('app-container').style.opacity = '1';
                setTimeout(() => document.getElementById('intro-screen').style.display = 'none', 700);
            }, 1200);
        });

        // Protected Tab Switcher
        window.switchTab = async (page, btn) => {
            if ((page === 'creator' || page === 'admin') && !auth.currentUser) {
                alert("Please log in to access this feature.");
                try {
                    await signInWithPopup(auth, new GoogleAuthProvider());
                } catch (err) {
                    console.error("Auth required to switch tab", err);
                    return;
                }
            }

            if(btn) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            document.getElementById('content-frame').src = page + '.html';
        };

        // Auth Logic
        document.getElementById('auth-trigger').addEventListener('click', async () => {
            if (auth.currentUser) await signOut(auth);
            else {
                try { await signInWithPopup(auth, new GoogleAuthProvider()); } 
                catch (err) { console.error("Auth failed", err); }
            }
        });

        onAuthStateChanged(auth, (user) => {
            const icon = document.getElementById('user-avatar-icon');
            const img = document.getElementById('user-avatar-img');
            const label = document.getElementById('user-name-label');
            if (user) {
                icon.classList.add('hidden'); img.classList.remove('hidden');
                img.src = user.photoURL || 'https://placehold.co/100';
                label.textContent = user.displayName?.split(' ')[0] || 'User';
            } else {
                icon.classList.remove('hidden'); img.classList.add('hidden');
                label.textContent = 'Log In';
            }
        });

        // Global Chat Notification Listener
        const toastContainer = document.getElementById('toast-container');
        const globalChatRef = query(dbRef(db, 'textnexus/chats/global/messages'), limitToLast(1));
        let initialLoad = true;

        onChildAdded(globalChatRef, (snapshot) => {
            if (initialLoad) {
                initialLoad = false;
                return;
            }
            const msg = snapshot.val();
            if (auth.currentUser && msg.email === auth.currentUser.email) return;

            const toast = document.createElement('div');
            toast.className = 'toast-notify bg-surface border border-border p-4 rounded-xl shadow-2xl flex items-start gap-3 w-80 pointer-events-auto';
            toast.innerHTML = `
                <img src="${msg.photoURL || 'https://placehold.co/100'}" class="w-10 h-10 rounded-full object-cover shrink-0">
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-textMain truncate">${msg.name}</p>
                    <p class="text-xs text-textMuted truncate">${msg.text}</p>
                </div>
            `;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        });
    </script>
</body>
</html>
