<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus — Premium Workspace</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] },
                    colors: {
                        appBg: '#050505', surface: 'rgba(20, 20, 20, 0.6)', 
                        borderSubtle: 'rgba(255,255,255,0.06)', brand: '#10b981'
                    },
                    animation: { 'spin-slow': 'spin 8s linear infinite' }
                }
            }
        }
    </script>

    <style>
        body { background-color: #050505; color: #f4f4f5; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* Ambient Background Glow */
        .ambient-bg {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        }
        .ambient-glow {
            position: absolute; width: 60vw; height: 60vw; border-radius: 50%;
            background: radial-gradient(circle, rgba(16,185,129,0.07) 0%, rgba(0,0,0,0) 70%);
            top: -20%; left: -10%; filter: blur(60px);
        }
        .ambient-glow-2 {
            position: absolute; width: 50vw; height: 50vw; border-radius: 50%;
            background: radial-gradient(circle, rgba(99,102,241,0.05) 0%, rgba(0,0,0,0) 70%);
            bottom: -20%; right: -10%; filter: blur(60px);
        }

        /* Premium Glass Utilities */
        .glass { background: rgba(20, 20, 22, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.05); }
        .glass-panel { background: rgba(10, 10, 10, 0.65); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-bottom: 1px solid rgba(255,255,255,0.04); }
        
        /* Smooth Intro Screen */
        #intro-screen {
            position: fixed; inset: 0; background-color: #050505; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }
        .intro-logo {
            font-family: 'Playfair Display', serif; font-size: 4rem; color: #fff;
            opacity: 0; transform: translateY(20px) scale(0.95);
            animation: floatUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); text-shadow: 0 10px 40px rgba(16, 185, 129, 0.25); }
        }

        /* Sidebar Item Animations */
        .nav-btn { position: relative; overflow: hidden; }
        .nav-btn::before {
            content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(16,185,129,0.1), transparent);
            opacity: 0; transition: opacity 0.3s ease; border-radius: inherit; pointer-events: none;
        }
        .nav-btn:hover::before, .nav-btn.active::before { opacity: 1; }
        .nav-btn.active { color: #fff; border-color: rgba(255,255,255,0.1); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); }
        .nav-btn.active i { color: #10b981; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="h-screen w-screen flex antialiased selection:bg-brand/30 selection:text-white">

    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="ambient-glow"></div>
        <div class="ambient-glow-2"></div>
    </div>

    <!-- Intro Screen -->
    <div id="intro-screen">
        <div class="intro-logo">Nexus</div>
        <div class="mt-8 flex items-center gap-3 text-xs text-zinc-500 tracking-[0.3em] uppercase">
            <span class="w-1.5 h-1.5 rounded-full bg-brand animate-pulse shadow-[0_0_10px_#10b981]"></span>
            Synchronizing
        </div>
    </div>

    <!-- Raycast-Style Command Palette (Ctrl+K) -->
    <div id="command-palette" class="fixed inset-0 z-[9998] bg-black/60 backdrop-blur-md flex items-start justify-center pt-[15vh] px-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass rounded-2xl w-full max-w-2xl shadow-2xl shadow-black/80 overflow-hidden transform scale-95 transition-transform duration-300" id="palette-box">
            <div class="flex items-center px-5 py-4 border-b border-white/5 gap-4">
                <i class="ph ph-magnifying-glass text-zinc-400 text-xl"></i>
                <input id="palette-input" type="text" placeholder="What do you want to do?" class="w-full bg-transparent border-none text-white text-lg font-light focus:outline-none placeholder:text-zinc-600">
                <kbd class="text-[10px] font-mono px-2 py-1 rounded bg-white/5 border border-white/10 text-zinc-400">ESC</kbd>
            </div>
            <div class="p-2 max-h-[350px] overflow-y-auto flex flex-col gap-1" id="palette-results">
                <div class="px-4 py-2 mt-2 text-[10px] font-semibold text-zinc-500 uppercase tracking-widest">Workspace Apps</div>
                <button onclick="paletteSelect('home.html', 'Dashboard')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-zinc-300 hover:text-white hover:bg-white/5 transition-all text-left text-sm cursor-pointer group">
                    <div class="flex items-center gap-3"><i class="ph ph-squares-four text-xl group-hover:text-brand transition-colors"></i><span>Dashboard</span></div>
                    <i class="ph ph-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
                </button>
                <button onclick="paletteSelect('youtube.html', 'Media Hub')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-zinc-300 hover:text-white hover:bg-white/5 transition-all text-left text-sm cursor-pointer group">
                    <div class="flex items-center gap-3"><i class="ph ph-youtube-logo text-xl group-hover:text-red-500 transition-colors"></i><span>Media Hub</span></div>
                    <i class="ph ph-arrow-right opacity-0 group-hover:opacity-100 transition-opacity"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-8 right-8 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

    <!-- Main App UI -->
    <div class="w-full h-full flex relative z-10 transition-all duration-1000 opacity-0 scale-[0.98]" id="app-container">
        
        <!-- Sidebar -->
        <aside class="w-[280px] h-full flex flex-col glass border-r border-borderSubtle shrink-0 select-none z-20 m-2 rounded-2xl overflow-hidden shadow-2xl">
            <div class="h-[80px] flex items-center px-6 border-b border-borderSubtle">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-zinc-800 to-black border border-white/10 flex items-center justify-center text-white shadow-lg relative overflow-hidden">
                        <div class="absolute inset-0 bg-brand/20 blur-xl"></div>
                        <i class="ph ph-hexagon text-2xl text-white relative z-10"></i>
                    </div>
                    <span class="font-serif text-2xl tracking-wide text-white">Nexus</span>
                </div>
            </div>

            <nav class="flex-1 px-4 py-6 flex flex-col gap-2 overflow-y-auto">
                <div class="px-3 mb-2 text-[10px] font-bold tracking-widest text-zinc-500 uppercase">Navigation</div>
                
                <button onclick="switchTab('home.html', this)" class="nav-btn active flex items-center justify-between px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium border border-transparent">
                    <div class="flex items-center gap-3"><i class="ph ph-squares-four text-lg"></i> Dashboard</div>
                </button>
                <button onclick="switchTab('youtube.html', this)" class="nav-btn flex items-center justify-between px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium border border-transparent">
                    <div class="flex items-center gap-3"><i class="ph ph-play-circle text-lg"></i> Media Hub</div>
                </button>
                <button onclick="switchTab('ghostlink.html', this)" class="nav-btn flex items-center justify-between px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium border border-transparent">
                    <div class="flex items-center gap-3"><i class="ph ph-ghost text-lg"></i> Ghostlink</div>
                </button>
                <button onclick="switchTab('updates.html', this)" class="nav-btn flex items-center justify-between px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium border border-transparent">
                    <div class="flex items-center gap-3"><i class="ph ph-sparkle text-lg"></i> Updates</div>
                </button>
            </nav>

            <div class="p-4 bg-black/40 border-t border-borderSubtle">
                <div class="flex items-center justify-between px-4 py-3 rounded-xl bg-white/5 border border-white/5 backdrop-blur-md">
                    <div class="flex items-center gap-3">
                        <div class="relative flex h-2.5 w-2.5">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-brand"></span>
                        </div>
                        <span class="text-xs text-zinc-300 font-medium tracking-wide">Network Synced</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-full relative z-10 py-2 pr-2">
            
            <!-- Top Header -->
            <header class="h-[80px] shrink-0 flex items-center justify-between px-8 glass-panel rounded-2xl mb-2 relative z-30 shadow-lg border border-borderSubtle">
                <div class="flex items-center gap-3 text-sm font-medium text-zinc-400">
                    <span id="current-page-title" class="text-white text-lg font-semibold tracking-tight">Dashboard</span>
                </div>

                <div class="flex items-center gap-5">
                    <!-- Live Clock -->
                    <div id="live-clock" class="hidden md:block text-xs font-mono text-zinc-500 tracking-wider">00:00 AM</div>
                    
                    <div class="w-px h-5 bg-white/10 hidden md:block"></div>

                    <button onclick="openPalette()" class="flex items-center gap-3 px-4 py-2.5 rounded-xl bg-black/40 hover:bg-black/60 border border-borderSubtle text-zinc-400 text-xs transition-all shadow-inner group">
                        <i class="ph ph-magnifying-glass text-sm group-hover:text-white transition-colors"></i>
                        <span class="hidden sm:block">Command Menu</span>
                        <kbd class="px-1.5 py-0.5 rounded bg-white/10 font-mono text-[10px] text-zinc-300">⌘K</kbd>
                    </button>

                    <!-- Auth Button -->
                    <button id="settings-trigger" class="flex items-center gap-2.5 px-2 py-2 rounded-xl bg-transparent hover:bg-white/5 border border-transparent hover:border-white/10 transition-all text-zinc-300">
                        <div class="w-8 h-8 rounded-lg bg-zinc-800 border border-white/10 flex items-center justify-center overflow-hidden">
                            <i id="user-avatar-icon" class="ph ph-user text-lg"></i>
                            <img id="user-avatar-img" src="" class="w-full h-full object-cover hidden">
                        </div>
                        <span id="user-name-label" class="text-xs font-semibold pr-2 hidden sm:block">Sign In</span>
                    </button>
                </div>
            </header>

            <!-- Iframe Container -->
            <div class="flex-1 w-full h-full relative rounded-2xl overflow-hidden glass border border-borderSubtle shadow-2xl">
                <iframe id="content-frame" class="w-full h-full border-none bg-transparent" src="home.html"></iframe>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Firebase Config
        const app = initializeApp({
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
        });
        const auth = getAuth(app);

        // Intro Animation
        window.addEventListener('load', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-screen');
                const appCont = document.getElementById('app-container');
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                    appCont.style.opacity = '1';
                    appCont.style.transform = 'scale(1)';
                }, 800);
            }, 2000);
        });

        // Live Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        // Toast Notifications
        window.showToast = (msg) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'glass px-5 py-3.5 rounded-xl text-white text-sm shadow-2xl flex items-center gap-3 transform translate-y-8 opacity-0 transition-all duration-300';
            toast.innerHTML = `<i class="ph ph-check-circle text-brand text-xl"></i> <span class="font-medium">${msg}</span>`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => toast.classList.remove('translate-y-8', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-8', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };

        // Tab Switching Logic
        window.switchTab = (page, btn) => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            const frame = document.getElementById('content-frame');
            
            if (page === 'youtube.html') {
                frame.srcdoc = `
                    <html class="dark"><head><script src="https://cdn.tailwindcss.com"><\/script></head>
                    <body class="bg-transparent text-white p-10 font-sans">
                        <div class="max-w-5xl mx-auto">
                            <h1 class="text-4xl font-serif mb-3 tracking-tight">Media Hub</h1>
                            <p class="text-zinc-400 mb-10 text-sm">Curated platform access.</p>
                            <div class="grid grid-cols-1 gap-8">
                                <div class="p-6 rounded-3xl bg-black/40 border border-white/5 backdrop-blur-md shadow-2xl">
                                    <div class="aspect-video bg-black rounded-2xl overflow-hidden shadow-inner">
                                        <iframe class="w-full h-full border-none" src="https://www.youtube.com/embed/9qbrOrj30TM" allowfullscreen></iframe>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </body></html>
                `;
            } else {
                frame.removeAttribute('srcdoc');
                frame.src = page;
            }

            const title = page.replace('.html', '');
            document.getElementById('current-page-title').textContent = title.charAt(0).toUpperCase() + title.slice(1);
        };

        // Command Palette Logic
        const palette = document.getElementById('command-palette');
        const pBox = document.getElementById('palette-box');
        const pInput = document.getElementById('palette-input');

        window.openPalette = () => {
            palette.classList.remove('opacity-0', 'pointer-events-none');
            pBox.classList.remove('scale-95');
            pInput.focus();
        };
        window.closePalette = () => {
            palette.classList.add('opacity-0', 'pointer-events-none');
            pBox.classList.add('scale-95');
            pInput.value = '';
        };
        window.paletteSelect = (page, name) => {
            switchTab(page);
            closePalette();
            showToast(`Launched ${name}`);
        };

        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openPalette(); }
            if (e.key === 'Escape') closePalette();
        });

        // Auth Logic
        document.getElementById('settings-trigger').addEventListener('click', async () => {
            if (auth.currentUser) {
                await signOut(auth);
                showToast("Logged out successfully");
            } else {
                try {
                    await signInWithPopup(auth, new GoogleAuthProvider());
                    showToast("Authentication successful");
                } catch (err) { }
            }
        });

        onAuthStateChanged(auth, (user) => {
            const icon = document.getElementById('user-avatar-icon');
            const img = document.getElementById('user-avatar-img');
            const label = document.getElementById('user-name-label');
            
            if (user) {
                icon.classList.add('hidden');
                img.classList.remove('hidden');
                img.src = user.photoURL || 'https://placehold.co/100';
                label.textContent = user.displayName?.split(' ')[0] || 'User';
            } else {
                icon.classList.remove('hidden');
                img.classList.add('hidden');
                label.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
