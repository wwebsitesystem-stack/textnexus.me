<body class="h-screen w-screen flex antialiased selection:bg-white/25 selection:text-white">

    <!-- STARTUP ANIMATION SCREEN -->
    <div id="intro-screen">
        <div class="intro-logo">Nexus</div>
        <div class="mt-4 flex items-center gap-2.5 text-xs text-textSecondary tracking-widest uppercase">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
            Loading Workspace
        </div>
    </div>

    <!-- COMMAND PALETTE MODAL (Ctrl+K / Cmd+K) -->
    <div id="command-palette" class="fixed inset-0 z-[9998] bg-black/70 backdrop-blur-md flex items-start justify-center pt-[12vh] px-4 opacity-0 pointer-events-none transition-all duration-200">
        <div class="bg-sidebarBg border border-borderColor rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200" id="palette-box">
            <div class="flex items-center px-4 py-3 border-b border-borderColor gap-3">
                <i class="ph ph-magnifying-glass text-textSecondary text-lg"></i>
                <input id="palette-input" type="text" placeholder="Search commands or tabs..." class="w-full bg-transparent border-none text-textPrimary text-sm focus:outline-none placeholder:text-textSecondary/60">
                <button onclick="closePalette()" class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-cardBg border border-borderColor text-textSecondary">ESC</button>
            </div>
            <div class="p-2 max-h-[260px] overflow-y-auto flex flex-col gap-1" id="palette-results">
                <div class="px-3 py-2 text-[10px] font-semibold text-textSecondary uppercase tracking-wider">Quick Navigation</div>
                <button onclick="paletteSelect('home.html', 'Home')" class="palette-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left text-xs font-medium cursor-pointer">
                    <div class="flex items-center gap-2.5"><i class="ph ph-house text-base"></i><span>Go to Home</span></div>
                </button>
                <button onclick="paletteSelect('youtube.html', 'YouTube')" class="palette-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left text-xs font-medium cursor-pointer">
                    <div class="flex items-center gap-2.5"><i class="ph ph-youtube-logo text-base text-red-500"></i><span>Open YouTube Hub</span></div>
                </button>
                <button onclick="paletteSelect('ghostlink.html', 'Ghostlink')" class="palette-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left text-xs font-medium cursor-pointer">
                    <div class="flex items-center gap-2.5"><i class="ph ph-ghost text-base"></i><span>Go to Ghostlink</span></div>
                </button>
                <button onclick="paletteSelect('updates.html', 'Updates')" class="palette-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left text-xs font-medium cursor-pointer">
                    <div class="flex items-center gap-2.5"><i class="ph ph-megaphone text-base"></i><span>View Updates</span></div>
                </button>
                <button onclick="paletteSelect('shoutouts.html', 'Shoutouts')" class="palette-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left text-xs font-medium cursor-pointer">
                    <div class="flex items-center gap-2.5"><i class="ph ph-star text-base"></i><span>View Shoutouts</span></div>
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-2 pointer-events-none px-4 sm:px-0"></div>

    <!-- MOBILE SIDEBAR BACKDROP -->
    <div id="sidebar-backdrop" onclick="toggleMobileSidebar(false)" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 lg:hidden opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container" class="w-full h-full flex relative z-10 app-reveal overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside id="mobile-sidebar" class="fixed lg:static inset-y-0 left-0 z-50 w-[270px] lg:w-[260px] h-full flex flex-col bg-sidebarBg border-r border-borderColor shrink-0 select-none transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
            
            <!-- Brand Header -->
            <div class="h-[72px] flex items-center justify-between px-6 border-b border-borderColor/60">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-[#2a2a2a] to-[#151515] border border-borderColor flex items-center justify-center text-textPrimary shadow-inner">
                        <i class="ph ph-cube text-base"></i>
                    </div>
                    <span class="font-serif text-2xl tracking-wide text-textPrimary font-medium">Nexus</span>
                </div>
                <button onclick="toggleMobileSidebar(false)" class="lg:hidden text-textSecondary hover:text-textPrimary p-1">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-3 py-5 flex flex-col gap-1 overflow-y-auto">
                <div class="px-3 mb-2 text-[10px] font-semibold tracking-wider text-textSecondary/70 uppercase">Workspace</div>
                
                <button onclick="switchTab('home.html', this)" data-page="home.html" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 lg:py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left font-medium text-[14px] lg:text-[13px] group active bg-activeBg text-textPrimary border border-borderColor/40">
                    <i class="ph ph-house text-lg group-hover:scale-110 transition-transform"></i>
                    <span>Home</span>
                </button>

                <button onclick="switchTab('youtube.html', this)" data-page="youtube.html" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 lg:py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left font-medium text-[14px] lg:text-[13px] group border border-transparent">
                    <i class="ph ph-youtube-logo text-lg text-red-500 group-hover:scale-110 transition-transform"></i>
                    <span>YouTube Hub</span>
                </button>

                <button onclick="switchTab('ghostlink.html', this)" data-page="ghostlink.html" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 lg:py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left font-medium text-[14px] lg:text-[13px] group border border-transparent">
                    <i class="ph ph-ghost text-lg group-hover:scale-110 transition-transform"></i>
                    <span>Ghostlink</span>
                </button>

                <button onclick="switchTab('updates.html', this)" data-page="updates.html" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 lg:py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left font-medium text-[14px] lg:text-[13px] group border border-transparent">
                    <i class="ph ph-megaphone text-lg group-hover:scale-110 transition-transform"></i>
                    <span>Updates</span>
                </button>

                <button onclick="switchTab('shoutouts.html', this)" data-page="shoutouts.html" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 lg:py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left font-medium text-[14px] lg:text-[13px] group border border-transparent">
                    <i class="ph ph-star text-lg group-hover:scale-110 transition-transform"></i>
                    <span>Shoutouts</span>
                </button>
            </nav>

            <!-- Sidebar Footer Status -->
            <div class="p-4 border-t border-borderColor/60 flex items-center justify-between text-xs text-textSecondary">
                <span class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Nexus + YouTube
                </span>
                <span class="font-mono text-[10px] px-1.5 py-0.5 rounded bg-cardBg border border-borderColor text-red-400">Live</span>
            </div>
        </aside>
