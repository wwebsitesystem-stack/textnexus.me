<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#0a0a0a',
                        surface: '#121212',
                        surfaceHover: '#1c1c1c',
                        border: '#262626',
                        textMain: '#ededed',
                        textMuted: '#a1a1aa',
                        brand: 'var(--brand-color)'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --brand-color: #ededed;
        }

        body { 
            background-color: #0a0a0a; 
            color: #ededed; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }

        /* Clean active state */
        .nav-btn.active { 
            background-color: #1c1c1c; 
            color: #ededed; 
        }
        .nav-btn.active i {
            color: var(--brand-color);
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="h-screen w-screen flex antialiased selection:bg-brand/20 selection:text-white">

    <!-- App Layout -->
    <div class="w-full h-full flex animate-[fadeIn_0.3s_ease-out]">
        
        <!-- Sidebar -->
        <aside class="w64 lg:w-72 h-full flex flex-col bg-surface border-r border-border shrink-0 select-none">
            
            <!-- Header -->
            <div class="h-16 flex items-center px-6 shrink-0 border-b border-border">
                <div class="flex items-center gap-3">
                    <div class="w-4 h-4 rounded-[3px] rotate-45 bg-textMain flex items-center justify-center">
                        <div class="w-1.5 h-1.5 bg-surface rounded-[1px]"></div>
                    </div>
                    <span class="font-medium text-sm tracking-wide text-textMain mt-0.5">Nexus</span>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 px-3 py-5 flex flex-col gap-1 overflow-y-auto">
                <p class="px-3 mb-2 text-[11px] font-semibold tracking-wider text-textMuted uppercase">Workspace</p>
                
                <button id="nav-home" onclick="switchTab('home', this)" class="nav-btn active flex items-center gap-3 px-3 py-2 rounded-lg text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors text-sm font-medium">
                    <i class="ph ph-house text-lg"></i> Overview
                </button>
                <button onclick="switchTab('ghostlink', this)" class="nav-btn flex items-center gap-3 px-3 py-2 rounded-lg text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors text-sm font-medium">
                    <i class="ph ph-ghost text-lg"></i> Ghostlink
                </button>
            </nav>

            <!-- Footer (Auth & Settings) -->
            <div class="p-3 flex flex-col gap-1 border-t border-border">
                <button id="settings-trigger" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-surfaceHover transition-colors text-left text-textMuted text-sm font-medium w-full group">
                    <div class="w-6 h-6 rounded-full bg-border flex items-center justify-center overflow-hidden shrink-0">
                        <i id="user-avatar-icon" class="ph ph-user text-xs text-textMuted"></i>
                        <img id="user-avatar-img" src="" class="w-full h-full object-cover hidden">
                    </div>
                    <span id="user-name-label" class="truncate flex-1">Log In</span>
                </button>

                <button onclick="openSettings()" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-surfaceHover transition-colors text-textMuted hover:text-textMain text-sm font-medium w-full">
                    <i class="ph ph-gear text-lg"></i> Settings
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 h-full relative bg-background">
            <iframe id="content-frame" class="w-full h-full border-none bg-transparent" src="home.html"></iframe>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-surface border border-border rounded-xl w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-200" id="settings-box">
            
            <div class="flex items-center justify-between px-6 py-4 border-b border-border">
                <h3 class="text-textMain font-medium text-sm">Settings</h3>
                <button onclick="closeSettings()" class="text-textMuted hover:text-textMain transition-colors"><i class="ph ph-x text-lg"></i></button>
            </div>
            
            <div class="p-6">
                <label class="text-xs font-medium text-textMuted mb-3 block">Accent Color</label>
                <div class="flex items-center gap-3">
                    <button onclick="setThemeColor('#ededed')" class="w-6 h-6 rounded-full bg-[#ededed] ring-2 ring-transparent focus:ring-border hover:scale-110 transition-transform"></button>
                    <button onclick="setThemeColor('#60a5fa')" class="w-6 h-6 rounded-full bg-blue-400 ring-2 ring-transparent focus:ring-border hover:scale-110 transition-transform"></button>
                    <button onclick="setThemeColor('#34d399')" class="w-6 h-6 rounded-full bg-emerald-400 ring-2 ring-transparent focus:ring-border hover:scale-110 transition-transform"></button>
                    <button onclick="setThemeColor('#f472b6')" class="w-6 h-6 rounded-full bg-pink-400 ring-2 ring-transparent focus:ring-border hover:scale-110 transition-transform"></button>
                    <button onclick="setThemeColor('#fb923c')" class="w-6 h-6 rounded-full bg-orange-400 ring-2 ring-transparent focus:ring-border hover:scale-110 transition-transform"></button>
                </div>
            </div>

            <div class="px-6 py-4 border-t border-border bg-background/50 rounded-b-xl flex justify-end">
                <button onclick="closeSettings()" class="px-4 py-2 rounded-lg bg-surfaceHover hover:bg-border text-textMain text-sm font-medium transition-colors">Done</button>
            </div>
        </div>
    </div>

    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const app = initializeApp({
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
        });
        const auth = getAuth(app);

        window.addEventListener('load', () => {
            const savedColor = localStorage.getItem('nexus-brand-color');
            if(savedColor) document.documentElement.style.setProperty('--brand-color', savedColor);
        });

        window.switchTab = (page, btn) => {
            if(btn) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            document.getElementById('content-frame').src = page + '.html';
        };

        const settingsModal = document.getElementById('settings-modal');
        const settingsBox = document.getElementById('settings-box');
        
        window.openSettings = () => {
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            settingsBox.classList.remove('scale-95');
        };
        
        window.closeSettings = () => {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            settingsBox.classList.add('scale-95');
        };

        window.setThemeColor = (colorHex) => {
            document.documentElement.style.setProperty('--brand-color', colorHex);
            localStorage.setItem('nexus-brand-color', colorHex);
            
            const iframe = document.getElementById('content-frame');
            if(iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'update-theme', color: colorHex }, '*');
            }
        };

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeSettings();
        });

        document.getElementById('settings-trigger').addEventListener('click', async () => {
            if (auth.currentUser) {
                await signOut(auth);
            } else {
                try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (err) { }
            }
        });

        onAuthStateChanged(auth, (user) => {
            const icon = document.getElementById('user-avatar-icon');
            const img = document.getElementById('user-avatar-img');
            const label = document.getElementById('user-name-label');
            
            if (user) {
                icon.classList.add('hidden');
                img.classList.remove('hidden');
                img.src = user.photoURL || 'https://placehold.co/100';
                label.textContent = user.displayName?.split(' ')[0] || 'User';
            } else {
                icon.classList.remove('hidden');
                img.classList.add('hidden');
                label.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
