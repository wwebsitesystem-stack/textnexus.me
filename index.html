<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Countdown Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #080c16; /* Deep dusk base */
            color: #ffffff;
        }

        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            background: #080c16;
        }

        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.6;
            animation: float-around 30s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        /* Soft Dusk Blue */
        .blob-blue {
            width: 70vw;
            height: 70vw;
            background: #1e3a5f; 
            top: -20vh;
            left: -10vw;
            animation-duration: 35s;
        }

        /* Pale Lavender */
        .blob-lavender {
            width: 60vw;
            height: 60vw;
            background: #5a4a75; 
            bottom: -20vh;
            right: -10vw;
            animation-duration: 40s;
            animation-delay: -10s;
        }

        /* Warm Peach */
        .blob-peach {
            width: 50vw;
            height: 50vw;
            background: #b57a73; 
            top: 25vh;
            left: 25vw;
            animation-duration: 28s;
            animation-delay: -5s;
            opacity: 0.4;
        }
        
        /* Muted Teal */
        .blob-teal {
            width: 45vw;
            height: 45vw;
            background: #3b6b6b; 
            bottom: 15vh;
            left: -5vw;
            animation-duration: 32s;
            animation-delay: -15s;
            opacity: 0.45;
        }

        @keyframes float-around {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(10vw, -10vh) scale(1.15); }
            66% { transform: translate(-8vw, 12vh) scale(0.9); }
            100% { transform: translate(12vw, 8vh) scale(1.05); }
        }

        .glowing-text {
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
            font-weight: 200;
        }
        
        .label-text {
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.45em;
            font-weight: 300;
            text-transform: uppercase;
        }
        
        .pre-title-text {
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.6em;
            font-weight: 300;
            text-transform: uppercase;
        }

        /* Responsive fluid typography */
        .number-size {
            font-size: clamp(3rem, 8vw, 8rem);
            line-height: 1;
        }
        
        .label-size {
            font-size: clamp(0.55rem, 1.2vw, 0.8rem);
            margin-top: clamp(1rem, 2vw, 2rem);
        }

        .title-size {
            font-size: clamp(1.8rem, 5vw, 4.5rem);
        }
        
        .subtitle-size {
            font-size: clamp(0.75rem, 1.5vw, 1.1rem);
        }

        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
        }

        /* Default state for countdown */
        #countdown-scene {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 2.5s cubic-bezier(0.4, 0, 0.2, 1), transform 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* When timer hits zero, countdown drifts up and fades out */
        #countdown-scene.drift-out {
            opacity: 0;
            transform: translateY(-50px);
            pointer-events: none;
        }

        /* Default state for success message (hidden, positioned slightly lower) */
        #success-scene {
            opacity: 0;
            transform: translateY(50px);
            pointer-events: none;
            transition: opacity 3s cubic-bezier(0.4, 0, 0.2, 1) 1.5s, transform 3s cubic-bezier(0.4, 0, 0.2, 1) 1.5s;
        }

        /* When timer hits zero, success message drifts up into place */
        #success-scene.drift-in {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
<body class="antialiased">

    <div class="aurora-bg">
        <div class="aurora-blob blob-blue"></div>
        <div class="aurora-blob blob-lavender"></div>
        <div class="aurora-blob blob-peach"></div>
        <div class="aurora-blob blob-teal"></div>
    </div>

    <main class="w-screen h-screen relative">
        
        <!-- INITIAL SCENE: COUNTDOWN -->
        <div id="countdown-scene" class="scene px-6">
            
            <div class="mb-16 md:mb-24 text-center">
                <span class="subtitle-size pre-title-text">Version 7.0 coming</span>
            </div>

            <div class="flex gap-6 md:gap-16 lg:gap-24 items-center justify-center w-full max-w-6xl">
                <!-- Days -->
                <div class="flex flex-col items-center">
                    <span id="days" class="number-size glowing-text tabular-nums tracking-tighter">00</span>
                    <span class="label-size label-text">Days</span>
                </div>
                
                <!-- Hours -->
                <div class="flex flex-col items-center">
                    <span id="hours" class="number-size glowing-text tabular-nums tracking-tighter">00</span>
                    <span class="label-size label-text">Hours</span>
                </div>
                
                <!-- Minutes -->
                <div class="flex flex-col items-center">
                    <span id="minutes" class="number-size glowing-text tabular-nums tracking-tighter">00</span>
                    <span class="label-size label-text">Minutes</span>
                </div>
                
                <!-- Seconds -->
                <div class="flex flex-col items-center">
                    <span id="seconds" class="number-size glowing-text tabular-nums tracking-tighter">00</span>
                    <span class="label-size label-text">Seconds</span>
                </div>
            </div>
        </div>

        <!-- COMPLETION SCENE: UPDATE MESSAGE -->
        <div id="success-scene" class="scene px-6 text-center">
            <h1 class="title-size glowing-text mb-6 tracking-tight">
                New update for Nexus.
            </h1>
            <!-- Ultra-minimal separator -->
            <div class="w-16 h-px bg-white/20 my-8 mx-auto"></div>
            <p class="subtitle-size label-text">
                Version 7.0
            </p>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Target Date: October 1, 2026, at 08:30:00 AM Central Time (CDT is UTC-05:00)
            const targetDate = new Date("2026-10-01T08:30:00-05:00").getTime();

            // DOM Elements
            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            
            const countdownScene = document.getElementById('countdown-scene');
            const successScene = document.getElementById('success-scene');

            // Formats numbers to always have two digits
            const padNumber = (num) => num.toString().padStart(2, '0');

            const updateTimer = () => {
                const now = new Date().getTime();
                const distance = targetDate - now;

                // Check if target time has been reached
                if (distance <= 0) {
                    clearInterval(timerInterval);
                    
                    // Lock timer at zero
                    daysEl.innerText = "00";
                    hoursEl.innerText = "00";
                    minutesEl.innerText = "00";
                    secondsEl.innerText = "00";
                    
                    // Trigger the beautiful, drifting cross-fade
                    triggerCompletionAnimation();
                    return;
                }

                // Calculate remaining time units
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                // Apply to DOM
                daysEl.innerText = padNumber(days);
                hoursEl.innerText = padNumber(hours);
                minutesEl.innerText = padNumber(minutes);
                secondsEl.innerText = padNumber(seconds);
            };

            const triggerCompletionAnimation = () => {
                // The CSS transitions handle the drift and fade properties
                countdownScene.classList.add('drift-out');
                successScene.classList.add('drift-in');
            };

            // Initialize instantly to prevent empty text on load
            updateTimer();
            // Start the interval
            const timerInterval = setInterval(updateTimer, 1000);
        });
    </script>
</body>
</html>
