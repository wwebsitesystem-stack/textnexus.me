<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Workspace</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons for modern symbols -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        mainBg: '#0e0e0e',
                        sidebarBg: '#131313',
                        cardBg: '#181818',
                        borderColor: '#222222',
                        borderHover: '#333333',
                        textPrimary: '#f3f3f3',
                        textSecondary: '#888888',
                        hoverBg: 'rgba(255, 255, 255, 0.05)',
                        activeBg: 'rgba(255, 255, 255, 0.09)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0e0e0e;
            color: #f3f3f3;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Startup animation sequence */
        #intro-screen {
            position: fixed;
            inset: 0;
            background-color: #0e0e0e;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
        }

        .intro-logo {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            letter-spacing: 0.05em;
            color: #f3f3f3;
            opacity: 0;
            transform: scale(0.92);
            animation: introPulse 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes introPulse {
            0% { opacity: 0; transform: scale(0.92); filter: blur(4px); }
            50% { opacity: 1; transform: scale(1); filter: blur(0px); text-shadow: 0 0 30px rgba(255,255,255,0.2); }
            100% { opacity: 1; transform: scale(1); filter: blur(0px); text-shadow: 0 0 10px rgba(255,255,255,0.05); }
        }

        .fade-out-intro {
            opacity: 0;
            visibility: hidden;
        }

        .app-reveal {
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-revealed {
            opacity: 1;
            transform: translateY(0);
        }

        /* Custom gorgeous scrollbars */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #383838;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(19, 19, 19, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="h-screen w-screen flex antialiased selection:bg-white/20 selection:text-white">

    <!-- STARTUP ANIMATION SCREEN -->
    <div id="intro-screen">
        <div class="intro-logo">Nexus</div>
        <div class="mt-4 flex items-center gap-2.5 text-xs text-textSecondary tracking-widest uppercase">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
            Loading Secure Workspace Environment
        </div>
    </div>

    <!-- COMMAND PALETTE MODAL (Ctrl+K / Cmd+K) -->
    <div id="command-palette" class="fixed inset-0 z-[9998] bg-black/70 backdrop-blur-md flex items-start justify-center pt-[15vh] opacity-0 pointer-events-none transition-all duration-200">
        <div class="bg-sidebarBg border border-borderColor rounded-2xl w-full max-w-lg mx-4 shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200" id="palette-box">
            <div class="flex items-center px-4 py-3 border-b border-borderColor gap-3">
                <i class="ph ph-magnifying-glass text-textSecondary text-lg"></i>
                <input id="palette-input" type="text" placeholder="Type a command or search tabs... (Esc to close)" class="w-full bg-transparent border-none text-textPrimary text-sm focus:outline-none placeholder:text-textSecondary/60">
                <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-cardBg border border-borderColor text-textSecondary">ESC</span>
            </div>
            <div class="p-2 max-h-[300px] overflow-y-auto flex flex-col gap-1" id="palette-results">
                <div class="px-3 py-2 text-[10px] font-semibold text-textSecondary uppercase tracking-wider">Quick Navigation</div>
                <button onclick="paletteSelect('home.html', 'Home')" class="palette-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left text-xs font-medium cursor-pointer group">
                    <div class="flex items-center gap-2.5"><i class="ph ph-house text-base"></i><span>Go to Home</span></div>
                    <span class="text-[10px] font-mono text-textSecondary/50 group-hover:text-textSecondary">Home</span>
                </button>
                <button onclick="paletteSelect('ghostlink.html', 'Ghostlink')" class="palette-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left text-xs font-medium cursor-pointer group">
                    <div class="flex items-center gap-2.5"><i class="ph ph-ghost text-base"></i><span>Go to Ghostlink</span></div>
                    <span class="text-[10px] font-mono text-textSecondary/50 group-hover:text-textSecondary">Ghostlink</span>
                </button>
                <button onclick="paletteSelect('updates.html', 'Updates')" class="palette-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left text-xs font-medium cursor-pointer group">
                    <div class="flex items-center gap-2.5"><i class="ph ph-megaphone text-base"></i><span>View Updates</span></div>
                    <span class="text-[10px] font-mono text-textSecondary/50 group-hover:text-textSecondary">Updates</span>
                </button>
                <button onclick="paletteSelect('shoutouts.html', 'Shoutouts')" class="palette-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left text-xs font-medium cursor-pointer group">
                    <div class="flex items-center gap-2.5"><i class="ph ph-star text-base"></i><span>View Shoutouts</span></div>
                    <span class="text-[10px] font-mono text-textSecondary/50 group-hover:text-textSecondary">Shoutouts</span>
                </button>
                <div class="px-3 pt-3 pb-1 text-[10px] font-semibold text-textSecondary uppercase tracking-wider">Workspace Actions</div>
                <button onclick="toggleDarkMode(); closePalette();" class="palette-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left text-xs font-medium cursor-pointer">
                    <div class="flex items-center gap-2.5"><i class="ph ph-moon text-base"></i><span>Toggle Theme Aesthetics</span></div>
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container" class="w-full h-full flex relative z-10 app-reveal">
        
        <!-- SIDEBAR -->
        <aside class="w-[260px] h-full flex flex-col bg-sidebarBg border-r border-borderColor shrink-0 select-none">
            
            <!-- Brand Header -->
            <div class="h-[72px] flex items-center justify-between px-6 border-b border-borderColor/60">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-[#2a2a2a] to-[#151515] border border-borderColor flex items-center justify-center text-textPrimary shadow-inner">
                        <i class="ph ph-cube text-base"></i>
                    </div>
                    <span class="font-serif text-2xl tracking-wide text-textPrimary font-medium">Nexus</span>
                </div>
                <button onclick="openPalette()" title="Command Menu" class="w-7 h-7 rounded-lg bg-cardBg hover:bg-borderHover border border-borderColor flex items-center justify-center text-textSecondary hover:text-textPrimary transition-all">
                    <i class="ph ph-command text-xs"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-3 py-5 flex flex-col gap-1 overflow-y-auto">
                <div class="px-3 mb-2 text-[10px] font-semibold tracking-wider text-textSecondary/70 uppercase">Workspace</div>
                
                <button onclick="switchTab('home.html', this)" data-page="home.html" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left font-medium text-[13px] group active bg-activeBg text-textPrimary border border-borderColor/40">
                    <i class="ph ph-house text-lg group-hover:scale-110 transition-transform"></i>
                    <span>Home</span>
                </button>

                <button onclick="switchTab('ghostlink.html', this)" data-page="ghostlink.html" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left font-medium text-[13px] group border border-transparent">
                    <i class="ph ph-ghost text-lg group-hover:scale-110 transition-transform"></i>
                    <span>Ghostlink</span>
                </button>

                <button onclick="switchTab('updates.html', this)" data-page="updates.html" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left font-medium text-[13px] group border border-transparent">
                    <i class="ph ph-megaphone text-lg group-hover:scale-110 transition-transform"></i>
                    <span>Updates</span>
                </button>

                <button onclick="switchTab('shoutouts.html', this)" data-page="shoutouts.html" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-textSecondary hover:text-textPrimary hover:bg-hoverBg transition-all text-left font-medium text-[13px] group border border-transparent">
                    <i class="ph ph-star text-lg group-hover:scale-110 transition-transform"></i>
                    <span>Shoutouts</span>
                </button>
            </nav>

            <!-- Sidebar Footer Status -->
            <div class="p-4 border-t border-borderColor/60 flex items-center justify-between text-xs text-textSecondary">
                <span class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Nexus v3.0
                </span>
                <span class="font-mono text-[10px] px-1.5 py-0.5 rounded bg-cardBg border border-borderColor text-emerald-400">Secure</span>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 flex flex-col h-full bg-mainBg relative overflow-hidden">
            
            <!-- TOP HEADER -->
            <header class="h-[72px] shrink-0 flex items-center justify-between px-8 border-b border-borderColor/60 glass-panel relative z-30">
                <div class="flex items-center gap-3">
                    <nav class="flex" aria-label="Breadcrumb">
                        <ol class="flex items-center space-x-2 text-xs font-medium text-textSecondary">
                            <li>Workspace</li>
                            <li><i class="ph ph-caret-right text-[10px]"></i></li>
                            <li id="current-page-title" class="text-textPrimary font-semibold">Home</li>
                        </ol>
                    </nav>
                </div>

                <!-- Right Actions & User Profile -->
                <div class="flex items-center gap-3">
                    <!-- Keyboard shortcut tip button -->
                    <button onclick="openPalette()" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-cardBg hover:bg-borderHover border border-borderColor text-textSecondary text-[11px] font-mono transition-all">
                        <span>Search</span>
                        <kbd class="px-1.5 py-0.5 rounded bg-mainBg border border-borderColor text-[10px]">⌘K</kbd>
                    </button>

                    <!-- Settings & Auth Trigger -->
                    <div class="relative">
                        <button id="settings-trigger" class="flex items-center gap-2.5 px-3.5 py-2 rounded-xl bg-cardBg hover:bg-borderHover border border-borderColor transition-all text-textPrimary shadow-sm cursor-pointer group">
                            <i id="user-avatar-icon" class="ph ph-user-circle text-xl text-textSecondary group-hover:text-textPrimary transition-colors"></i>
                            <img id="user-avatar-img" src="" alt="Avatar" class="w-6 h-6 rounded-full object-cover hidden border border-borderColor">
                            <span id="user-name-label" class="text-xs font-medium max-w-[120px] truncate">Sign In</span>
                            <i class="ph ph-caret-down text-xs text-textSecondary"></i>
                        </button>

                        <!-- Auth Dropdown Menu -->
                        <div id="auth-dropdown" class="absolute right-0 top-full mt-2 w-64 bg-sidebarBg border border-borderColor rounded-2xl shadow-2xl shadow-black/80 p-2 opacity-0 pointer-events-none transform -translate-y-2 transition-all duration-200 z-50">
                            <div id="dropdown-user-info" class="p-3 mb-2 rounded-xl bg-cardBg border border-borderColor hidden">
                                <p id="dropdown-display-name" class="text-xs font-semibold text-textPrimary truncate"></p>
                                <p id="dropdown-email" class="text-[11px] text-textSecondary truncate mt-0.5 font-mono"></p>
                            </div>

                            <div class="flex flex-col gap-1">
                                <button id="google-signin-btn" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-textPrimary text-mainBg hover:bg-white transition-all text-xs font-semibold shadow cursor-pointer">
                                    <i class="ph ph-google-logo text-base"></i>
                                    <span>Sign in with Google</span>
                                </button>
                                <button id="google-signout-btn" class="w-full hidden items-center gap-3 px-3 py-2.5 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 transition-all text-xs font-semibold cursor-pointer border border-red-500/20">
                                    <i class="ph ph-sign-out text-base"></i>
                                    <span>Sign Out</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- IFRAME CONTAINER WITH LOADING STATE -->
            <div class="flex-1 w-full h-full relative bg-mainBg">
                <iframe 
                    id="content-frame"
                    name="content-frame"
                    src="home.html" 
                    class="w-full h-full border-none absolute inset-0 bg-mainBg"
                    title="Nexus Content Frame">
                </iframe>
            </div>
        </main>
    </div>

    <!-- FIREBASE AND APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
            projectId: "nexus-web-development-official",
            storageBucket: "nexus-web-development-official.firebasestorage.app",
            messagingSenderId: "553556577139",
            appId: "1:553556577139:web:ea4469b06c2c01cc999306",
            measurementId: "G-S6K1M5PZLE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Startup animation controller
        window.addEventListener('load', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-screen');
                intro.classList.add('fade-out-intro');
                
                setTimeout(() => {
                    intro.style.display = 'none';
                    document.getElementById('app-container').classList.add('app-revealed');
                    
                    // Restore last active tab from localStorage if available
                    const savedTab = localStorage.getItem('nexus_active_tab');
                    if (savedTab) {
                        const btn = document.querySelector(`[data-page="${savedTab}"]`);
                        if (btn) window.switchTab(savedTab, btn, false);
                    }
                }, 600);
            }, 1400);
        });

        // Toast Notification System
        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-2.5 px-4 py-3 rounded-xl bg-sidebarBg border border-borderColor text-textPrimary text-xs shadow-2xl transition-all transform translate-y-4 opacity-0 pointer-events-auto`;
            
            let icon = 'ph-info text-blue-400';
            if (type === 'success') icon = 'ph-check-circle text-emerald-400';
            if (type === 'error') icon = 'ph-warning-circle text-red-400';

            toast.innerHTML = `<i class="ph ${icon} text-base"></i><span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };

        // Tab Switching with State Memory
        window.switchTab = function(page, element, save = true) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-activeBg', 'text-textPrimary', 'border-borderColor/40');
                btn.classList.add('border-transparent', 'text-textSecondary');
            });
            
            if (element) {
                element.classList.add('active', 'bg-activeBg', 'text-textPrimary', 'border-borderColor/40');
                element.classList.remove('border-transparent', 'text-textSecondary');
            }

            const frame = document.getElementById('content-frame');
            frame.src = page;

            const name = page.replace('.html', '');
            const titleFormatted = name.charAt(0).toUpperCase() + name.slice(1);
            document.getElementById('current-page-title').textContent = titleFormatted;

            if (save) {
                localStorage.setItem('nexus_active_tab', page);
            }
        };

        // Command Palette Logic
        const palette = document.getElementById('command-palette');
        const paletteBox = document.getElementById('palette-box');
        const paletteInput = document.getElementById('palette-input');

        window.openPalette = function() {
            palette.classList.remove('opacity-0', 'pointer-events-none');
            paletteBox.classList.remove('scale-95');
            paletteBox.classList.add('scale-100');
            paletteInput.focus();
        }

        window.closePalette = function() {
            palette.classList.add('opacity-0', 'pointer-events-none');
            paletteBox.classList.remove('scale-100');
            paletteBox.classList.add('scale-95');
            paletteInput.value = '';
        }

        window.paletteSelect = function(page, name) {
            const btn = document.querySelector(`[data-page="${page}"]`);
            switchTab(page, btn);
            closePalette();
            showToast(`Switched to ${name}`, 'success');
        }

        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                if (palette.classList.contains('pointer-events-none')) {
                    openPalette();
                } else {
                    closePalette();
                }
            }
            if (e.key === 'Escape') {
                closePalette();
                toggleDropdown(false);
            }
        });

        palette.addEventListener('click', (e) => {
            if (e.target === palette) closePalette();
        });

        paletteInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.palette-item');
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        // Dropdown toggle logic
        const trigger = document.getElementById('settings-trigger');
        const dropdown = document.getElementById('auth-dropdown');
        let isDropdownOpen = false;

        function toggleDropdown(state) {
            isDropdownOpen = state !== undefined ? state : !isDropdownOpen;
            if (isDropdownOpen) {
                dropdown.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
                dropdown.classList.add('opacity-100', 'translate-y-0');
            } else {
                dropdown.classList.remove('opacity-100', 'translate-y-0');
                dropdown.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
            }
        }

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        document.addEventListener('click', (e) => {
            if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
                toggleDropdown(false);
            }
        });

        // Theme toggle feature placeholder
        window.toggleDarkMode = function() {
            showToast("Nexus is locked in ultra-sleek dark aesthetic.", "success");
        };

        // Google Sign In action
        const signinBtn = document.getElementById('google-signin-btn');
        signinBtn.addEventListener('click', async () => {
            try {
                signinBtn.style.opacity = '0.7';
                signinBtn.querySelector('span').textContent = "Signing in...";
                await signInWithPopup(auth, provider);
                toggleDropdown(false);
                showToast("Successfully signed in with Google!", "success");
            } catch (error) {
                console.error("Auth error:", error);
                showToast("Sign-in failed. Check popup blockers or Firebase domains.", "error");
            } finally {
                signinBtn.style.opacity = '1';
                signinBtn.querySelector('span').textContent = "Sign in with Google";
            }
        });

        // Sign Out action
        const signoutBtn = document.getElementById('google-signout-btn');
        signoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                toggleDropdown(false);
                showToast("Signed out successfully.", "info");
            } catch (error) {
                console.error("Sign out error:", error);
            }
        });

        // Firebase Auth State Observer
        const avatarIcon = document.getElementById('user-avatar-icon');
        const avatarImg = document.getElementById('user-avatar-img');
        const userNameLabel = document.getElementById('user-name-label');
        const userInfoBox = document.getElementById('dropdown-user-info');
        const displayNameEl = document.getElementById('dropdown-display-name');
        const emailEl = document.getElementById('dropdown-email');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                avatarIcon.classList.add('hidden');
                avatarImg.classList.remove('hidden');
                avatarImg.src = user.photoURL || 'https://placehold.co/100x100/222/eee?text=U';
                userNameLabel.textContent = user.displayName || user.email || 'Account';
                userInfoBox.classList.remove('hidden');
                displayNameEl.textContent = user.displayName || 'Nexus User';
                emailEl.textContent = user.email || '';
                signinBtn.classList.add('hidden');
                signoutBtn.classList.remove('hidden');
                signoutBtn.classList.add('flex');
            } else {
                avatarIcon.classList.remove('hidden');
                avatarImg.classList.add('hidden');
                avatarImg.src = '';
                userNameLabel.textContent = "Sign In";
                userInfoBox.classList.add('hidden');
                displayNameEl.textContent = '';
                emailEl.textContent = '';
                signinBtn.classList.remove('hidden');
                signoutBtn.classList.add('hidden');
                signoutBtn.classList.remove('flex');
            }
        });
    </script>
</body>
</html>
