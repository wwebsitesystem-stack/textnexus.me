<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus — Next-Gen OS Workspace</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'], 
                        display: ['Syne', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        appBg: '#030305',
                        surface: 'rgba(15, 15, 20, 0.65)',
                        surfaceHover: 'rgba(255, 255, 255, 0.06)',
                        borderSubtle: 'rgba(255, 255, 255, 0.08)'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.35);
            --accent-rgb: 16, 185, 129;
        }

        body { 
            background-color: #030305; 
            color: #f4f4f5; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow: hidden; 
            user-select: none;
        }

        #bg-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.8;
        }

        .glass { 
            background: rgba(12, 12, 18, 0.65); 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px); 
            border: 1px solid rgba(255, 255, 255, 0.07); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .glass-panel { 
            background: rgba(8, 8, 12, 0.7); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.06); 
        }

        .accent-text { color: var(--accent); }
        .accent-bg { background-color: var(--accent); }
        .accent-border { border-color: var(--accent); }
        .accent-glow-box { box-shadow: 0 0 25px var(--accent-glow); }
        
        #intro-screen {
            position: fixed; inset: 0; background-color: #030305; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s ease;
        }
        .intro-logo {
            font-family: 'Syne', sans-serif; font-size: 4.5rem; font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(12px);
            animation: introReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes introReveal {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
        }

        .nav-btn {
            position: relative; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-btn::before {
            content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 3px;
            background: var(--accent); border-radius: 0 4px 4px 0;
            opacity: 0; transform: scaleY(0); transition: all 0.25s ease;
        }
        .nav-btn.active {
            background: rgba(255, 255, 255, 0.07); color: #fff;
            border-color: rgba(255, 255, 255, 0.12);
        }
        .nav-btn.active::before { opacity: 1; transform: scaleY(1); }
        .nav-btn.active i { color: var(--accent); }

        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.8s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .toast-enter { transform: translateY(20px) scale(0.95); opacity: 0; }
        .toast-show { transform: translateY(0) scale(1); opacity: 1; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        window.playSFX = (freq = 440, type = 'sine', duration = 0.04) => {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        };

        window.toggleSound = () => {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            const status = document.getElementById('palette-sound-status');
            if (soundEnabled) {
                icon.className = "ph ph-speaker-high text-lg";
                if (status) status.textContent = "Enabled";
                showToast("UI Audio Enabled");
                playSFX(800, 'sine', 0.1);
            } else {
                icon.className = "ph ph-speaker-x text-lg text-zinc-500";
                if (status) status.textContent = "Disabled";
                showToast("UI Audio Muted");
            }
        };

        window.setTheme = (hex, glow) => {
            document.documentElement.style.setProperty('--accent', hex);
            document.documentElement.style.setProperty('--accent-glow', glow);
            playSFX(600, 'triangle', 0.08);
            showToast(`Accent Updated`);
        };

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = Array.from({ length: 35 }, () => ({
            x: Math.random() * width, y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
            size: Math.random() * 2 + 1
        }));

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        window.addEventListener('load', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-screen');
                const appCont = document.getElementById('app-container');
                intro.style.opacity = '0';
                intro.style.transform = 'scale(1.05)';
                playSFX(520, 'sine', 0.15);
                setTimeout(() => {
                    intro.style.display = 'none';
                    appCont.style.opacity = '1';
                    appCont.style.transform = 'scale(1)';
                }, 800);
            }, 1600);
        });

        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('live-date').textContent = now.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
        }, 1000);

        window.showToast = (msg) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'glass px-5 py-3.5 rounded-xl text-white text-sm shadow-2xl flex items-center gap-3 border border-white/10 toast-enter transition-all duration-300';
            toast.innerHTML = `<i class="ph ph-check-circle text-lg accent-text"></i> <span class="font-medium">${msg}</span>`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => toast.classList.replace('toast-enter', 'toast-show'));
            setTimeout(() => {
                toast.classList.replace('toast-show', 'toast-enter');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        };

        window.switchTab = (page, btn) => {
            playSFX(400, 'sine', 0.05);
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            const loader = document.getElementById('frame-loader');
            const frame = document.getElementById('content-frame');
            
            loader.style.opacity = '1';
            loader.style.pointerEvents = 'auto';

            setTimeout(() => {
                frame.removeAttribute('srcdoc');
                frame.src = page;
                
                const title = page.replace('.html', '');
                document.getElementById('current-page-title').textContent = title.charAt(0).toUpperCase() + title.slice(1);
                
                setTimeout(() => {
                    loader.style.opacity = '0';
                    loader.style.pointerEvents = 'none';
                }, 300);
            }, 400);
        };

        const pInput = document.getElementById('palette-input');
        pInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('.palette-item').forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        });

        const palette = document.getElementById('command-palette');
        const pBox = document.getElementById('palette-box');

        window.openPalette = () => {
            playSFX(700, 'sine', 0.06);
            palette.classList.remove('opacity-0', 'pointer-events-none');
            pBox.classList.remove('scale-95');
            pInput.focus();
        };
        window.closePalette = () => {
            palette.classList.add('opacity-0', 'pointer-events-none');
            pBox.classList.add('scale-95');
            pInput.value = '';
            document.querySelectorAll('.palette-item').forEach(i => i.style.display = 'flex');
        };
        window.paletteSelect = (page, name) => {
            switchTab(page);
            closePalette();
            showToast(`Navigated to ${name}`);
        };

        const settingsModal = document.getElementById('settings-modal');
        window.openSettingsModal = () => {
            closePalette();
            playSFX(650, 'sine', 0.05);
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
        };
        window.closeSettingsModal = () => {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
        };

        const shortcutsModal = document.getElementById('shortcuts-modal');
        window.openShortcutsModal = () => {
            closePalette();
            playSFX(650, 'sine', 0.05);
            shortcutsModal.classList.remove('opacity-0', 'pointer-events-none');
        };
        window.closeShortcutsModal = () => {
            shortcutsModal.classList.add('opacity-0', 'pointer-events-none');
        };

        let keyBuffer = '';
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') { 
                e.preventDefault(); 
                palette.classList.contains('opacity-0') ? openPalette() : closePalette(); 
            }
            if (e.key === 'Escape') {
                closePalette();
                closeShortcutsModal();
                closeSettingsModal();
            }
            if (e.key === '?' && document.activeElement.tagName !== 'INPUT') {
                openShortcutsModal();
            }

            if (document.activeElement.tagName !== 'INPUT') {
                keyBuffer += e.key.toLowerCase();
                if (keyBuffer.endsWith('gh')) { switchTab('home.html'); keyBuffer = ''; }
                setTimeout(() => keyBuffer = '', 1000);
            }
        });

        const authBtn = document.getElementById('auth-trigger');
        authBtn.addEventListener('click', async () => {
            playSFX(500, 'sine', 0.05);
            if (auth.currentUser) {
                await signOut(auth);
                showToast("Signed out successfully");
            } else {
                try {
                    await signInWithPopup(auth, new GoogleAuthProvider());
                    showToast("Welcome back!");
                } catch (err) {
                    showToast("Authentication canceled");
                }
            }
        });

        onAuthStateChanged(auth, (user) => {
            const icon = document.getElementById('user-avatar-icon');
            const img = document.getElementById('user-avatar-img');
            const label = document.getElementById('user-name-label');
            
            if (user) {
                icon.classList.add('hidden');
                img.classList.remove('hidden');
                img.src = user.photoURL || 'https://placehold.co/100';
                label.textContent = user.displayName?.split(' ')[0] || 'User';
            } else {
                icon.classList.remove('hidden');
                img.classList.add('hidden');
                label.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
