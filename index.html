<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus — Workspace</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        serif: ['"Playfair Display"', 'serif'] 
                    },
                    colors: {
                        sidebar: 'rgba(18, 18, 18, 0.4)',
                        main: '#0a0a0a', 
                        borderSubtle: 'rgba(255,255,255,0.04)',
                        brand: 'var(--brand-color)'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --brand-color: #a3a3a3; /* Default chill grey */
        }

        body { 
            background-color: #080808; 
            color: #d4d4d4; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            /* Very soft, chill background gradient */
            background-image: radial-gradient(circle at 50% -20%, rgba(255,255,255,0.02) 0%, transparent 60%);
        }
        
        /* Smooth, Relaxed Intro Screen */
        #intro-screen {
            position: fixed; inset: 0; background-color: #080808; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.2s ease-in-out, visibility 1.2s;
        }
        .intro-logo {
            font-family: 'Playfair Display', serif; font-size: 2.5rem; color: #fff;
            opacity: 0; font-weight: 400;
            animation: chillFade 2s ease-out forwards;
        }
        
        @keyframes chillFade {
            0% { opacity: 0; filter: blur(8px); transform: scale(0.98); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        /* Soft Active States for Nav */
        .nav-btn.active { 
            background-color: color-mix(in srgb, var(--brand-color) 8%, transparent);
            color: #fff; 
        }
        .nav-btn.active i { 
            color: var(--brand-color); 
        }

        /* Minimal Scrollbar */
        ::-webkit-scrollbar { width: 2px; height: 2px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.1); }

        /* Soft Glass */
        .chill-glass {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
    </style>
</head>
<body class="h-screen w-screen flex antialiased selection:bg-brand/20 selection:text-white relative">

    <!-- Subtle Ambient Backdrop -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[80%] h-[40%] bg-[var(--brand-color)] rounded-full blur-[200px] opacity-[0.015] pointer-events-none transition-colors duration-1000"></div>

    <!-- Intro Screen -->
    <div id="intro-screen">
        <div class="intro-logo tracking-widest text-white/90">NEXUS</div>
    </div>

    <!-- Main App UI -->
    <div class="w-full h-full flex relative z-10 transition-all duration-[1.5s] ease-out opacity-0" id="app-container">
        
        <!-- Sidebar -->
        <aside class="w-[260px] h-full flex flex-col chill-glass bg-sidebar border-r border-borderSubtle shrink-0 select-none z-20">
            
            <!-- Header Logo -->
            <div class="h-[80px] flex items-center justify-between px-7 shrink-0">
                <div class="flex items-center gap-4 group cursor-pointer opacity-80 hover:opacity-100 transition-opacity duration-500">
                    <div class="w-2 h-2 bg-[var(--brand-color)] rounded-full shadow-[0_0_12px_var(--brand-color)] opacity-70 group-hover:opacity-100 transition-all duration-700"></div>
                    <span class="font-serif text-lg tracking-[0.2em] text-white/90 mt-0.5">NEXUS</span>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-4 py-6 flex flex-col gap-2 overflow-y-auto">
                
                <div class="px-3 mb-3 text-[9px] font-medium tracking-[0.2em] text-zinc-600 uppercase">
                    Menu
                </div>
                
                <button id="nav-home" onclick="switchTab('home', this)" class="nav-btn active flex items-center gap-4 px-4 py-3.5 rounded-2xl text-zinc-400 hover:text-zinc-200 hover:bg-white/[0.02] transition-all duration-300 text-sm font-light text-left">
                    <i class="ph ph-house text-lg w-5 text-center transition-transform duration-500 hover:-translate-y-0.5"></i> 
                    <span class="truncate flex-1">Overview</span>
                </button>
                <button onclick="switchTab('ghostlink', this)" class="nav-btn flex items-center gap-4 px-4 py-3.5 rounded-2xl text-zinc-400 hover:text-zinc-200 hover:bg-white/[0.02] transition-all duration-300 text-sm font-light text-left">
                    <i class="ph ph-ghost text-lg w-5 text-center transition-transform duration-500 hover:-translate-y-0.5"></i> 
                    <span class="truncate flex-1">Ghostlink</span>
                </button>
            </nav>

            <!-- Bottom Profile & Settings Area -->
            <div class="p-4 flex flex-col gap-2">
                <button id="settings-trigger" class="flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-white/[0.02] transition-all duration-300 text-left text-zinc-400 text-sm font-light w-full group">
                    <div class="w-7 h-7 rounded-full bg-zinc-800/50 flex items-center justify-center overflow-hidden shrink-0">
                        <i id="user-avatar-icon" class="ph ph-user text-sm text-zinc-500 group-hover:text-zinc-300 transition-colors"></i>
                        <img id="user-avatar-img" src="" class="w-full h-full object-cover hidden">
                    </div>
                    <span id="user-name-label" class="truncate flex-1 text-sm group-hover:text-zinc-200 transition-colors">Sign In</span>
                </button>

                <button onclick="openSettings()" class="flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-white/[0.02] transition-all duration-300 text-left text-zinc-400 hover:text-zinc-200 text-sm font-light w-full group">
                    <i class="ph ph-faders w-7 text-center text-lg group-hover:rotate-180 transition-transform duration-700"></i> Settings
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 h-full relative z-10 bg-transparent">
            <iframe id="content-frame" class="w-full h-full border-none bg-transparent" src="home.html"></iframe>
        </main>
    </div>

    <!-- Chill Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-[9998] bg-black/40 backdrop-blur-md flex items-center justify-center opacity-0 pointer-events-none transition-all duration-700 ease-out">
        <div class="bg-[#0f0f0f] border border-borderSubtle rounded-[2rem] w-full max-w-sm shadow-2xl transform scale-95 translate-y-2 transition-all duration-700 ease-out p-1" id="settings-box">
            
            <div class="bg-[#141414] rounded-[1.8rem] p-8">
                <div class="flex items-center justify-between mb-8">
                    <h3 class="text-zinc-200 font-medium text-lg">Appearance</h3>
                    <button onclick="closeSettings()" class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-500 hover:text-zinc-200 hover:bg-white/5 transition-all duration-300"><i class="ph ph-x text-lg"></i></button>
                </div>
                
                <div class="flex flex-col gap-6 mb-8">
                    <div>
                        <label class="text-[10px] font-medium text-zinc-500 uppercase tracking-[0.15em] mb-4 block">Accent Color</label>
                        <div class="flex items-center gap-4 flex-wrap">
                            <!-- Softer pastel/muted colors for a chill vibe -->
                            <button onclick="setThemeColor('#a3a3a3')" class="w-8 h-8 rounded-full bg-[#a3a3a3] hover:scale-110 transition-transform duration-300 shadow-sm"></button>
                            <button onclick="setThemeColor('#81a1c1')" class="w-8 h-8 rounded-full bg-[#81a1c1] hover:scale-110 transition-transform duration-300 shadow-sm"></button>
                            <button onclick="setThemeColor('#a3be8c')" class="w-8 h-8 rounded-full bg-[#a3be8c] hover:scale-110 transition-transform duration-300 shadow-sm"></button>
                            <button onclick="setThemeColor('#b48ead')" class="w-8 h-8 rounded-full bg-[#b48ead] hover:scale-110 transition-transform duration-300 shadow-sm"></button>
                            <button onclick="setThemeColor('#ebcb8b')" class="w-8 h-8 rounded-full bg-[#ebcb8b] hover:scale-110 transition-transform duration-300 shadow-sm"></button>
                            <button onclick="setThemeColor('#bf616a')" class="w-8 h-8 rounded-full bg-[#bf616a] hover:scale-110 transition-transform duration-300 shadow-sm"></button>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end">
                    <button onclick="closeSettings()" class="px-6 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 text-sm font-medium transition-all duration-300">Done</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Minimal Toast Notifications -->
    <div id="toast-container" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const app = initializeApp({
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
        });
        const auth = getAuth(app);

        window.addEventListener('load', () => {
            const savedColor = localStorage.getItem('nexus-brand-color');
            if(savedColor) document.documentElement.style.setProperty('--brand-color', savedColor);

            // Gentle fade in
            setTimeout(() => {
                const intro = document.getElementById('intro-screen');
                const appCont = document.getElementById('app-container');
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.visibility = 'hidden';
                    appCont.style.opacity = '1';
                }, 1200);
            }, 1800);
        });

        window.switchTab = (page, btn) => {
            if(btn) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            const iframeView = document.getElementById('content-frame');
            iframeView.style.opacity = '0';
            setTimeout(() => {
                iframeView.src = page + '.html';
                iframeView.onload = () => iframeView.style.opacity = '1';
            }, 300);
        };

        const settingsModal = document.getElementById('settings-modal');
        const settingsBox = document.getElementById('settings-box');
        
        window.openSettings = () => {
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            settingsBox.classList.remove('scale-95', 'translate-y-2');
        };
        
        window.closeSettings = () => {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            settingsBox.classList.add('scale-95', 'translate-y-2');
        };

        window.setThemeColor = (colorHex) => {
            document.documentElement.style.setProperty('--brand-color', colorHex);
            localStorage.setItem('nexus-brand-color', colorHex);
            
            const iframe = document.getElementById('content-frame');
            if(iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'update-theme', color: colorHex }, '*');
            }
            showToast('Vibe updated.');
        };

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeSettings();
        });

        // Soft, center-aligned toast
        window.showToast = (msg) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'chill-glass bg-[#1a1a1a]/60 border border-white/5 px-6 py-2.5 rounded-full text-zinc-300 text-sm shadow-xl flex items-center gap-3 transform translate-y-4 opacity-0 transition-all duration-700 ease-out font-light';
            toast.innerHTML = `<span>${msg}</span>`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => toast.classList.remove('translate-y-4', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 700);
            }, 3000);
        };

        document.getElementById('settings-trigger').addEventListener('click', async () => {
            if (auth.currentUser) {
                await signOut(auth);
                showToast("Signed out.");
            } else {
                try {
                    await signInWithPopup(auth, new GoogleAuthProvider());
                    showToast("Welcome in.");
                } catch (err) { }
            }
        });

        onAuthStateChanged(auth, (user) => {
            const icon = document.getElementById('user-avatar-icon');
            const img = document.getElementById('user-avatar-img');
            const label = document.getElementById('user-name-label');
            
            if (user) {
                icon.classList.add('hidden');
                img.classList.remove('hidden');
                img.src = user.photoURL || 'https://placehold.co/100';
                label.textContent = user.displayName?.split(' ')[0] || 'User';
            } else {
                icon.classList.remove('hidden');
                img.classList.add('hidden');
                label.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
