<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextNexus</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#0a0a0a',
                        surface: '#121212',
                        surfaceHover: '#1c1c1c',
                        border: '#262626',
                        textMain: '#ededed',
                        textMuted: '#a1a1aa'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0a; color: #ededed; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        .chat-active { background-color: #1c1c1c; border-color: #3f3f46; }
    </style>
</head>
<body class="w-screen h-screen flex overflow-hidden bg-background">

    <!-- Chat Sidebar -->
    <aside class="w-64 border-r border-border bg-background flex flex-col h-full shrink-0">
        <div class="p-4 border-b border-border flex items-center justify-between">
            <h2 class="font-semibold text-textMain text-sm">Chats</h2>
            <div class="flex items-center gap-1">
                <button onclick="openModal('join-modal')" class="p-1.5 rounded-lg bg-surface hover:bg-surfaceHover border border-border text-textMuted hover:text-textMain transition-colors" title="Join with Code">
                    <i class="ph ph-keyhole text-sm"></i>
                </button>
                <button onclick="openModal('create-modal')" class="p-1.5 rounded-lg bg-surface hover:bg-surfaceHover border border-border text-textMuted hover:text-textMain transition-colors" title="Create Group Chat">
                    <i class="ph ph-plus text-sm"></i>
                </button>
            </div>
        </div>
        
        <!-- Channels List -->
        <div class="flex-1 overflow-y-auto p-2 flex flex-col gap-1" id="chat-list">
            <!-- Global Chat (Default Pinned) -->
            <button id="btn-global" onclick="loadChat('global', 'Global Chat')" class="w-full text-left p-3 rounded-xl chat-active border border-transparent flex items-center gap-3 group transition-colors">
                <div class="w-8 h-8 rounded-full bg-textMain/10 text-textMain flex items-center justify-center shrink-0">
                    <i class="ph ph-globe-hemisphere text-lg"></i>
                </div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-sm font-medium text-textMain truncate">Global Chat</p>
                    <p class="text-[11px] text-textMuted truncate">Public channel</p>
                </div>
            </button>
            <!-- Custom group chats will inject here -->
        </div>
    </aside>

    <!-- Main Workspace (Chat Area) -->
    <main class="flex-1 flex flex-col h-full bg-surface relative overflow-hidden">
        
        <!-- Chat Header -->
        <header class="h-16 border-b border-border flex items-center justify-between px-6 bg-surface shrink-0 z-10">
            <div class="flex items-center gap-3">
                <i class="ph ph-hash text-textMuted text-xl"></i>
                <div>
                    <h2 id="current-chat-title" class="font-semibold text-textMain text-sm">Global Chat</h2>
                    <p id="invite-code-display" class="text-[10px] text-textMuted hidden">Invite Code: <span id="code-value" class="font-mono text-textMain font-bold"></span></p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Calling Coming Soon -->
                <button class="w-8 h-8 rounded-lg hover:bg-surfaceHover flex items-center justify-center text-textMuted opacity-50 cursor-not-allowed transition-colors" title="Calling coming soon">
                    <i class="ph ph-phone text-lg"></i>
                </button>
                <!-- Chat Settings (For Chat Owner) -->
                <button id="chat-settings-btn" onclick="openModal('settings-chat-modal')" class="hidden w-8 h-8 rounded-lg hover:bg-surfaceHover flex items-center justify-center text-textMuted transition-colors">
                    <i class="ph ph-dots-three text-xl"></i>
                </button>
            </div>
        </header>

        <!-- Scrollable Messages Container -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-6 flex flex-col gap-4">
            <div class="text-center text-xs text-textMuted my-4">Welcome to TextNexus</div>
        </div>

        <!-- Pinned Input Box at Bottom -->
        <div class="p-4 border-t border-border bg-background shrink-0">
            <div id="disabled-notice" class="hidden text-center py-2 text-xs text-red-400 font-medium">
                <i class="ph ph-lock-key"></i> This chat has been disabled by the owner.
            </div>

            <div id="input-wrapper" class="max-w-4xl mx-auto relative flex flex-col gap-2">
                <!-- File Preview Area -->
                <div id="file-preview-area" class="hidden flex items-center gap-2 bg-surface border border-border rounded-lg p-2 w-fit">
                    <img id="preview-img" src="" alt="Preview" class="hidden w-12 h-12 object-cover rounded-md border border-border">
                    <div id="preview-file-info" class="hidden flex items-center gap-2 text-xs text-textMuted">
                        <i class="ph ph-file text-lg text-textMain"></i>
                        <span id="preview-file-name" class="max-w-[150px] truncate font-medium text-textMain"></span>
                    </div>
                    <button onclick="clearAttachment()" class="ml-2 text-textMuted hover:text-red-400 transition-colors">
                        <i class="ph ph-x text-sm"></i>
                    </button>
                </div>

                <!-- Input Row -->
                <div class="relative flex items-center">
                    <input type="file" id="file-input" class="hidden" accept="image/*,application/pdf,.txt,.doc,.docx,.zip,.rar,.csv,.json,.xml,.mp3,.mp4">
                    <button id="attach-btn" type="button" class="absolute left-2 w-8 h-8 flex items-center justify-center text-textMuted hover:text-textMain transition-colors z-10">
                        <i class="ph ph-paperclip text-lg"></i>
                    </button>
                    <input type="text" id="message-input" placeholder="Type a message..." disabled class="w-full bg-surface border border-border rounded-xl py-3 pl-11 pr-12 outline-none text-sm text-textMain focus:border-textMuted transition-colors disabled:opacity-50">
                    <button id="send-btn" disabled class="absolute right-2 w-8 h-8 bg-textMain text-background rounded-lg flex items-center justify-center disabled:opacity-50 hover:opacity-90 transition-opacity">
                        <i class="ph ph-paper-plane-right text-sm"></i>
                    </button>
                </div>
            </div>
            <p id="login-warning" class="text-center text-[11px] text-textMuted mt-2 hidden">You must log in from the sidebar to send messages.</p>
        </div>
    </main>

    <!-- Create Group Chat Modal -->
    <div id="create-modal" class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center opacity-0 pointer-events-none transition-opacity">
        <div class="bg-surface border border-border rounded-xl w-full max-w-sm p-6 shadow-2xl flex flex-col gap-4">
            <h3 class="font-medium text-textMain text-base">Create Group Chat</h3>
            <div>
                <label class="text-xs text-textMuted mb-1 block">Group Name</label>
                <input type="text" id="new-group-name" placeholder="e.g. Project Team" class="w-full bg-background border border-border rounded-lg px-3 py-2 text-sm text-textMain outline-none focus:border-textMuted">
            </div>
            <div class="flex justify-end gap-2 mt-2">
                <button onclick="closeModal('create-modal')" class="px-3 py-1.5 rounded-lg text-xs text-textMuted hover:text-textMain">Cancel</button>
                <button id="confirm-create-btn" class="px-4 py-1.5 rounded-lg text-xs bg-textMain text-background font-medium hover:opacity-90">Create</button>
            </div>
        </div>
    </div>

    <!-- Join Group Chat Modal -->
    <div id="join-modal" class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center opacity-0 pointer-events-none transition-opacity">
        <div class="bg-surface border border-border rounded-xl w-full max-w-sm p-6 shadow-2xl flex flex-col gap-4">
            <h3 class="font-medium text-textMain text-base">Join Group Chat</h3>
            <div>
                <label class="text-xs text-textMuted mb-1 block">Enter 6-Character Code</label>
                <input type="text" id="join-code-input" placeholder="e.g. X8K2P9" uppercase class="w-full bg-background border border-border rounded-lg px-3 py-2 text-sm text-textMain uppercase outline-none focus:border-textMuted font-mono">
            </div>
            <div class="flex justify-end gap-2 mt-2">
                <button onclick="closeModal('join-modal')" class="px-3 py-1.5 rounded-lg text-xs text-textMuted hover:text-textMain">Cancel</button>
                <button id="confirm-join-btn" class="px-4 py-1.5 rounded-lg text-xs bg-textMain text-background font-medium hover:opacity-90">Join</button>
            </div>
        </div>
    </div>

    <!-- Chat Settings Modal (Owner Controls) -->
    <div id="settings-chat-modal" class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center opacity-0 pointer-events-none transition-opacity">
        <div class="bg-surface border border-border rounded-xl w-full max-w-sm p-6 shadow-2xl flex flex-col gap-4">
            <h3 class="font-medium text-textMain text-base">Chat Management</h3>
            <p class="text-xs text-textMuted">As the owner of this group chat, you can control its status or delete it entirely.</p>
            <div class="flex flex-col gap-2 mt-2">
                <button id="toggle-disable-btn" class="w-full py-2 rounded-lg border border-border bg-background hover:bg-surfaceHover text-xs text-textMain font-medium transition-colors">
                    Disable Chat
                </button>
                <button id="delete-chat-btn" class="w-full py-2 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500/20 text-xs font-medium transition-colors">
                    Delete Group Chat
                </button>
            </div>
            <button onclick="closeModal('settings-chat-modal')" class="mt-2 text-xs text-textMuted hover:text-textMain text-center">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref as dbRef, push, set, onValue, serverTimestamp, off, update, remove, get } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
            storageBucket: "nexus-web-development-official.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const storage = getStorage(app);

        let currentUser = null;
        let activeChatId = 'global';
        let currentChatData = null;
        let currentMessagesListener = null;
        let pendingFile = null;

        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const loginWarning = document.getElementById('login-warning');
        const chatTitle = document.getElementById('current-chat-title');
        const inviteCodeDisplay = document.getElementById('invite-code-display');
        const codeValue = document.getElementById('code-value');
        const chatSettingsBtn = document.getElementById('chat-settings-btn');
        const chatList = document.getElementById('chat-list');
        const disabledNotice = document.getElementById('disabled-notice');
        const inputWrapper = document.getElementById('input-wrapper');
        const fileInput = document.getElementById('file-input');
        const attachBtn = document.getElementById('attach-btn');
        const filePreviewArea = document.getElementById('file-preview-area');
        const previewImg = document.getElementById('preview-img');
        const previewFileInfo = document.getElementById('preview-file-info');
        const previewFileName = document.getElementById('preview-file-name');

        // Modal Helpers
        window.openModal = (id) => document.getElementById(id).classList.remove('opacity-0', 'pointer-events-none');
        window.closeModal = (id) => document.getElementById(id).classList.add('opacity-0', 'pointer-events-none');

        // File Attachment Handling
        attachBtn.addEventListener('click', () => {
            if (!currentUser) return alert('Please log in first.');
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            pendingFile = file;

            filePreviewArea.classList.remove('hidden');
            previewImg.classList.add('hidden');
            previewFileInfo.classList.add('hidden');

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    previewImg.src = ev.target.result;
                    previewImg.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                previewFileName.textContent = file.name;
                previewFileInfo.classList.remove('hidden');
            }
        });

        window.clearAttachment = () => {
            pendingFile = null;
            fileInput.value = '';
            filePreviewArea.classList.add('hidden');
            previewImg.src = '';
            previewImg.classList.add('hidden');
            previewFileInfo.classList.add('hidden');
        };

        // Check Auth Status
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                loginWarning.classList.add('hidden');
                messageInput.placeholder = `Message as ${user.displayName}...`;
            } else {
                messageInput.disabled = true;
                sendBtn.disabled = true;
                loginWarning.classList.remove('hidden');
                messageInput.placeholder = "Log in from sidebar to chat";
                clearAttachment();
            }
            listenToUserChats();
        });

        // Listen for joined/created group chats
        function listenToUserChats() {
            const chatsRef = dbRef(db, 'textnexus/chats');
            onValue(chatsRef, (snapshot) => {
                const data = snapshot.val();
                
                // Clear extra chats (preserve Global)
                const globalBtn = document.getElementById('btn-global');
                chatList.innerHTML = '';
                chatList.appendChild(globalBtn);

                if (!data) return;

                Object.keys(data).forEach(chatId => {
                    if (chatId === 'global') return;
                    const chat = data[chatId];
                    
                    // Show if user is owner or member
                    const isOwner = currentUser && (chat.createdBy === currentUser.uid || currentUser.email === 'brodywilliams0226@gmail.com');
                    const isMember = currentUser && chat.members && chat.members[currentUser.uid];

                    if (isOwner || isMember) {
                        const btn = document.createElement('button');
                        btn.onclick = () => loadChat(chatId, chat.name);
                        btn.className = `w-full text-left p-3 rounded-xl border border-transparent flex items-center gap-3 transition-colors ${activeChatId === chatId ? 'chat-active' : 'hover:bg-surfaceHover'}`;
                        btn.innerHTML = `
                            <div class="w-8 h-8 rounded-full bg-border flex items-center justify-center shrink-0 text-textMuted">
                                <i class="ph ph-users text-sm"></i>
                            </div>
                            <div class="flex-1 overflow-hidden">
                                <p class="text-sm font-medium text-textMain truncate">${chat.name}</p>
                                <p class="text-[11px] text-textMuted truncate">Code: ${chat.code}</p>
                            </div>
                        `;
                        chatList.appendChild(btn);
                    }
                });
            });
        }

        // Load Active Chat
        window.loadChat = (chatId, title) => {
            activeChatId = chatId;
            chatTitle.textContent = title;
            messagesContainer.innerHTML = '<div class="text-center text-xs text-textMuted my-4"><i class="ph ph-spinner animate-spin text-lg"></i> Loading messages...</div>';
            
            if (currentMessagesListener) off(currentMessagesListener);

            const chatRef = dbRef(db, `textnexus/chats/${chatId}`);
            onValue(chatRef, (snapshot) => {
                currentChatData = snapshot.val();

                // Handle global or missing
                if (chatId === 'global') {
                    inviteCodeDisplay.classList.add('hidden');
                    chatSettingsBtn.classList.add('hidden');
                    inputWrapper.classList.remove('hidden');
                    disabledNotice.classList.add('hidden');
                } else if (currentChatData) {
                    inviteCodeDisplay.classList.remove('hidden');
                    codeValue.textContent = currentChatData.code;

                    // Owner permissions check
                    const isOwner = currentUser && (currentChatData.createdBy === currentUser.uid || currentUser.email === 'brodywilliams0226@gmail.com');
                    if (isOwner) chatSettingsBtn.classList.remove('hidden');
                    else chatSettingsBtn.classList.add('hidden');

                    // Disabled status check
                    if (currentChatData.disabled) {
                        inputWrapper.classList.add('hidden');
                        disabledNotice.classList.remove('hidden');
                    } else {
                        inputWrapper.classList.remove('hidden');
                        disabledNotice.classList.add('hidden');
                    }

                    // Update toggle button text in modal
                    document.getElementById('toggle-disable-btn').textContent = currentChatData.disabled ? 'Enable Chat' : 'Disable Chat';
                }

                // Render Messages
                const msgs = currentChatData && currentChatData.messages ? currentChatData.messages : {};
                messagesContainer.innerHTML = '';

                const sortedMsgs = Object.keys(msgs).map(k => ({ id: k, ...msgs[k] })).sort((a,b) => (a.timestamp||0) - (b.timestamp||0));

                if (sortedMsgs.length === 0) {
                    messagesContainer.innerHTML = '<div class="text-center text-xs text-textMuted my-4">No messages yet. Say hi!</div>';
                } else {
                    sortedMsgs.forEach(msg => {
                        const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Now';
                        let badgeHtml = '';
                        if (msg.email === 'brodywilliams0226@gmail.com') {
                            badgeHtml = `<span class="ml-2 text-[9px] uppercase tracking-wider bg-textMain/10 text-textMain border border-textMain/20 px-1.5 py-0.5 rounded-md font-bold">Owner</span>`;
                        }

                        const isMe = currentUser && msg.email === currentUser.email;

                        const msgDiv = document.createElement('div');
                        msgDiv.className = `flex items-start gap-3 max-w-2xl ${isMe ? 'ml-auto flex-row-reverse' : ''}`;
                        
                        let attachmentHtml = '';
                        if (msg.fileUrl) {
                            if (msg.fileType && msg.fileType.startsWith('image/')) {
                                attachmentHtml = `
                                    <a href="${msg.fileUrl}" target="_blank" rel="noopener noreferrer" class="block mt-2">
                                        <img src="${msg.fileUrl}" alt="Uploaded image" class="max-w-full max-h-64 rounded-lg border border-border object-contain cursor-pointer hover:opacity-90 transition-opacity">
                                    </a>
                                `;
                            } else {
                                const iconClass = getFileIcon(msg.fileName);
                                attachmentHtml = `
                                    <a href="${msg.fileUrl}" target="_blank" rel="noopener noreferrer" download="${msg.fileName}" class="mt-2 flex items-center gap-3 bg-surface border border-border rounded-lg px-4 py-3 hover:bg-surfaceHover transition-colors group/file">
                                        <i class="${iconClass} text-2xl text-textMuted group-hover/file:text-textMain transition-colors"></i>
                                        <div class="flex flex-col overflow-hidden">
                                            <span class="text-xs font-medium text-textMain truncate max-w-[200px]">${msg.fileName || 'Download File'}</span>
                                            <span class="text-[10px] text-textMuted">Click to download</span>
                                        </div>
                                        <i class="ph ph-download-simple text-textMuted ml-auto group-hover/file:text-textMain transition-colors"></i>
                                    </a>
                                `;
                            }
                        }

                        const bubbleBg = isMe ? 'bg-textMain text-background' : 'bg-background border border-border text-textMain';
                        const bubbleRadius = isMe ? 'rounded-2xl rounded-tr-sm' : 'rounded-2xl rounded-tl-sm';

                        msgDiv.innerHTML = `
                            <img src="${msg.photoURL || 'https://placehold.co/100'}" class="w-8 h-8 rounded-full object-cover shrink-0 border border-border">
                            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-medium text-textMain">${msg.name}</span>
                                    ${!isMe ? badgeHtml : ''}
                                    <span class="text-[10px] text-textMuted">${time}</span>
                                </div>
                                ${msg.text ? `<div class="${bubbleBg} px-4 py-2 ${bubbleRadius} text-sm leading-relaxed">${escapeHtml(msg.text)}</div>` : ''}
                                ${attachmentHtml}
                            </div>
                        `;
                        messagesContainer.appendChild(msgDiv);
                    });
                }
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getFileIcon(fileName) {
            if (!fileName) return 'ph ph-file';
            const ext = fileName.split('.').pop().toLowerCase();
            const icons = {
                pdf: 'ph ph-file-pdf text-red-400',
                doc: 'ph ph-file-doc text-blue-400',
                docx: 'ph ph-file-doc text-blue-400',
                xls: 'ph ph-file-xls text-green-400',
                xlsx: 'ph ph-file-xls text-green-400',
                ppt: 'ph ph-file-ppt text-orange-400',
                pptx: 'ph ph-file-ppt text-orange-400',
                zip: 'ph ph-file-zip text-yellow-400',
                rar: 'ph ph-file-zip text-yellow-400',
                mp3: 'ph ph-file-audio text-purple-400',
                wav: 'ph ph-file-audio text-purple-400',
                mp4: 'ph ph-file-video text-pink-400',
                mov: 'ph ph-file-video text-pink-400',
                txt: 'ph ph-file-text text-textMuted',
                json: 'ph ph-file-code text-yellow-300',
                js: 'ph ph-file-js text-yellow-300',
                html: 'ph ph-file-html text-orange-400',
                css: 'ph ph-file-css text-blue-400',
            };
            return icons[ext] || 'ph ph-file text-textMuted';
        }

        // Send Message
        const sendMessage = async () => {
            const text = messageInput.value.trim();
            if ((!text && !pendingFile) || !currentUser) return;
            if (currentChatData && currentChatData.disabled) return;

            const originalPlaceholder = messageInput.placeholder;
            messageInput.disabled = true;
            sendBtn.disabled = true;
            attachBtn.classList.add('opacity-50', 'pointer-events-none');

            let fileUrl = null;
            let fileName = null;
            let fileType = null;

            try {
                if (pendingFile) {
                    messageInput.placeholder = 'Uploading file...';
                    const safeName = `${Date.now()}_${pendingFile.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
                    const path = `textnexus/uploads/${activeChatId}/${currentUser.uid}/${safeName}`;
                    const fileRef = storageRef(storage, path);
                    
                    await uploadBytes(fileRef, pendingFile);
                    fileUrl = await getDownloadURL(fileRef);
                    fileName = pendingFile.name;
                    fileType = pendingFile.type;
                }

                const msgData = {
                    uid: currentUser.uid,
                    email: currentUser.email,
                    name: currentUser.displayName?.split(' ')[0] || 'User',
                    photoURL: currentUser.photoURL,
                    timestamp: serverTimestamp()
                };

                if (text) msgData.text = text;
                if (fileUrl) {
                    msgData.fileUrl = fileUrl;
                    msgData.fileName = fileName;
                    msgData.fileType = fileType;
                }

                const msgRef = dbRef(db, `textnexus/chats/${activeChatId}/messages`);
                await push(msgRef, msgData);

                messageInput.value = '';
                clearAttachment();
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Failed to send message or upload file. Please try again.');
            } finally {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                attachBtn.classList.remove('opacity-50', 'pointer-events-none');
                messageInput.placeholder = originalPlaceholder;
                messageInput.focus();
            }
        };

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // Create Group Chat Handler
        document.getElementById('confirm-create-btn').addEventListener('click', async () => {
            const name = document.getElementById('new-group-name').value.trim();
            if (!name || !currentUser) return;

            const inviteCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            const newChatRef = push(dbRef(db, 'textnexus/chats'));

            await set(newChatRef, {
                name: name,
                code: inviteCode,
                createdBy: currentUser.uid,
                createdEmail: currentUser.email,
                disabled: false,
                members: {
                    [currentUser.uid]: true
                }
            });

            document.getElementById('new-group-name').value = '';
            closeModal('create-modal');
            loadChat(newChatRef.key, name);
        });

        // Join Group Chat Handler
        document.getElementById('confirm-join-btn').addEventListener('click', async () => {
            const codeInput = document.getElementById('join-code-input').value.trim().toUpperCase();
            if (!codeInput || !currentUser) return;

            const chatsRef = dbRef(db, 'textnexus/chats');
            const snapshot = await get(chatsRef);
            const chats = snapshot.val();

            let foundChatId = null;
            let foundChatName = '';

            if (chats) {
                Object.keys(chats).forEach(id => {
                    if (chats[id].code === codeInput) {
                        foundChatId = id;
                        foundChatName = chats[id].name;
                    }
                });
            }

            if (foundChatId) {
                await update(dbRef(db, `textnexus/chats/${foundChatId}/members`), {
                    [currentUser.uid]: true
                });
                document.getElementById('join-code-input').value = '';
                closeModal('join-modal');
                loadChat(foundChatId, foundChatName);
            } else {
                alert('Invalid invite code. Please try again.');
            }
        });

        // Toggle Disable Chat
        document.getElementById('toggle-disable-btn').addEventListener('click', async () => {
            if (!activeChatId || activeChatId === 'global') return;
            const newStatus = !currentChatData.disabled;
            await update(dbRef(db, `textnexus/chats/${activeChatId}`), { disabled: newStatus });
            closeModal('settings-chat-modal');
        });

        // Delete Chat
        document.getElementById('delete-chat-btn').addEventListener('click', async () => {
            if (!activeChatId || activeChatId === 'global') return;
            if (confirm('Are you sure you want to delete this chat? This cannot be undone.')) {
                await remove(dbRef(db, `textnexus/chats/${activeChatId}`));
                closeModal('settings-chat-modal');
                loadChat('global', 'Global Chat');
            }
        });

        // Initialize Global Chat
        loadChat('global', 'Global Chat');
    </script>
</body>
</html>
