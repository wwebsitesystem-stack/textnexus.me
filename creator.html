<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Creator Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#0a0a0a',
                        surface: '#121212',
                        surfaceHover: '#1c1c1c',
                        border: '#262626',
                        textMain: '#ededed',
                        textMuted: '#a1a1aa',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen w-screen flex flex-col bg-background text-textMain antialiased overflow-hidden">

    <!-- Top Bar -->
    <header class="h-16 flex items-center justify-between px-6 border-b border-border bg-surface shrink-0">
        <div class="flex items-center gap-4">
            <a href="index.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-border text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors text-sm font-medium">
                <i class="ph ph-arrow-left text-base"></i> Back to Nexus
            </a>
            <span class="font-medium text-sm text-textMain">Nexus Creator Workspace</span>
        </div>
        <div class="flex items-center gap-4">
            <div id="creditDisplay" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-surfaceHover border border-border text-emerald-400">
                Credits: Loading...
            </div>
        </div>
    </header>

    <!-- Main Workspace Split View -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Panel: AI Prompt & Chat History -->
        <div class="w-96 border-r border-border bg-surface flex flex-col shrink-0">
            <div id="chatHistory" class="flex-1 p-5 overflow-y-auto flex flex-col gap-4 text-sm">
                <div class="p-3.5 rounded-xl bg-surfaceHover border border-border text-textMuted leading-relaxed">
                    Welcome to the Creator Workspace! Describe your website, enter your subdomain, and generate a custom AI site. Each build costs <span class="text-textMain font-semibold">1,000 credits</span> and remains active for 7 days.
                </div>
            </div>

            <div class="p-4 border-t border-border bg-background flex flex-col gap-3">
                <input type="text" id="subdomainInput" placeholder="Subdomain (e.g. mysite)" class="w-full bg-surface border border-border rounded-lg px-3.5 py-2.5 text-sm text-textMain focus:outline-none focus:border-zinc-500 placeholder:text-zinc-600">
                <textarea id="promptInput" rows="3" placeholder="What kind of website do you want to build?" class="w-full bg-surface border border-border rounded-lg px-3.5 py-2.5 text-sm text-textMain focus:outline-none focus:border-zinc-500 placeholder:text-zinc-600 resize-none"></textarea>
                <button onclick="startBuild()" class="w-full bg-textMain text-background font-semibold py-2.5 rounded-lg text-sm hover:bg-zinc-200 transition-colors">
                    Build Website (1,000 Credits)
                </button>
            </div>
        </div>

        <!-- Right Panel: Live Preview Frame -->
        <div class="flex-1 bg-background flex items-center justify-center relative">
            <div id="previewPlaceholder" class="flex flex-col items-center gap-2 text-textMuted text-sm">
                <i class="ph ph-globe text-3xl text-zinc-700"></i>
                <p>Your live website preview will load here once generated.</p>
            </div>
            <iframe id="previewFrame" class="w-full h-full border-none hidden bg-white"></iframe>

            <!-- Floating AI Edit Bar (Appears after site generation) -->
            <div id="editBar" class="absolute bottom-6 left-1/2 -translate-x-1/2 w-3/4 max-w-2xl bg-surface border border-border rounded-2xl shadow-2xl hidden flex-col overflow-hidden z-50">
                <div id="editLoading" class="hidden h-1 text-xs bg-emerald-500 w-full animate-pulse"></div>
                <div class="flex items-center gap-2 p-2">
                    <input type="text" id="editPromptInput" placeholder="Ask AI to modify this page..." class="flex-1 bg-transparent border-none text-sm text-textMain px-3 py-2 focus:outline-none placeholder:text-zinc-600">
                    <button onclick="updateSite()" class="p-2 bg-textMain text-background rounded-xl hover:bg-zinc-200 transition-colors">
                        <i class="ph ph-paper-plane-right text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase & Workspace Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, push, set, update, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const WORKER_URL = "https://little-unit-9bae.brodywilliams0226.workers.dev/";

        let activeSubdomain = "";
        let activeRepo = "";
        let userCredits = 10000;

        // Check Authentication & Real-time Firebase Credits on Load
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                alert("Please log in from the main Nexus dashboard first.");
                window.location.href = "index.html";
                return;
            }

            // Sync credits live with Firebase (connected with admin.html)
            const userRef = ref(db, `textnexus/users/${user.uid}`);
            onValue(userRef, (snapshot) => {
                const data = snapshot.val();
                if (data && data.credits !== undefined) {
                    userCredits = data.credits;
                } else {
                    // Initialize default credits if not set
                    userCredits = 10000;
                    update(userRef, { credits: userCredits, email: user.email, name: user.displayName || 'User' });
                }
                document.getElementById('creditDisplay').innerText = `Credits: ${userCredits.toLocaleString()}`;
            });
        });

        // 1. Initial Website Build
        window.startBuild = async () => {
            const user = auth.currentUser;
            if (!user) {
                alert("You must be logged in.");
                return;
            }

            const subdomain = document.getElementById('subdomainInput').value.trim();
            const prompt = document.getElementById('promptInput').value.trim();
            const chatContainer = document.getElementById('chatHistory');
            const previewPlaceholder = document.getElementById('previewPlaceholder');
            const previewFrame = document.getElementById('previewFrame');

            if (!subdomain || !prompt) {
                alert("Please provide both a subdomain and an AI prompt.");
                return;
            }

            if (userCredits < 1000) {
                alert("Insufficient credits! You need at least 1,000 credits to build a website.");
                return;
            }

            chatContainer.innerHTML += `<div class="p-3 rounded-xl bg-surface border border-border text-textMain self-end max-w-[85%]">Building: "${prompt}" (${subdomain}.textnexus.me)</div>`;
            chatContainer.innerHTML += `<div id="loadingMsg" class="p-3 rounded-xl bg-surfaceHover border border-border text-textMuted">Configuring DNS, building repo, and setting up site...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, subdomain, userCredits })
                });

                const data = await response.json();
                if (document.getElementById('loadingMsg')) document.getElementById('loadingMsg').remove();

                if (response.ok) {
                    // Deduct 1,000 credits and update Firebase
                    userCredits -= 1000;
                    await update(ref(db, `textnexus/users/${user.uid}`), { credits: userCredits });

                    // Save Site Entry to Firebase Realtime Database (Both user-specific and global ai_sites log for admin)
                    const userSitesRef = ref(db, `users/${user.uid}/sites`);
                    const newSiteRef = push(userSitesRef);
                    set(newSiteRef, {
                        subdomain: subdomain,
                        url: data.siteUrl,
                        prompt: prompt,
                        createdAt: Date.now(),
                        expiresAt: Date.now() + (7 * 24 * 60 * 60 * 1000)
                    });

                    // Also log to textnexus/ai_sites so it shows up in admin.html's AI Generated Sites tab
                    const adminSitesRef = ref(db, 'textnexus/ai_sites');
                    push(adminSitesRef, {
                        userEmail: user.email,
                        subdomain: subdomain,
                        prompt: prompt,
                        createdAt: Date.now()
                    });

                    // Store Active Session Info for Iterative AI Editing
                    activeSubdomain = subdomain;
                    activeRepo = `nexus-${subdomain}`;

                    chatContainer.innerHTML += `<div class="p-3 rounded-xl bg-surfaceHover border border-border text-textMain">Success! Your site is live at <a href="${data.siteUrl}" target="_blank" class="text-blue-400 underline">${data.siteUrl}</a>.<br><span class="text-xs text-textMuted mt-1 block">Active for 7 days. To renew, email nexus.web.solutions@putlook.com</span></div>`;

                    // Unhide Live Preview & Edit Bar
                    previewPlaceholder.classList.add('hidden');
                    previewFrame.classList.remove('hidden');
                    previewFrame.src = data.siteUrl;

                    const editBar = document.getElementById('editBar');
                    editBar.classList.remove('hidden');
                    editBar.classList.add('flex');
                } else {
                    chatContainer.innerHTML += `<div class="p-3 rounded-xl bg-red-950/40 border border-red-900/50 text-red-300">Error: ${data.error || 'Build failed.'}</div>`;
                }
            } catch (err) {
                if (document.getElementById('loadingMsg')) document.getElementById('loadingMsg').remove();
                chatContainer.innerHTML += `<div class="p-3 rounded-xl bg-red-950/40 border border-red-900/50 text-red-300">Network connection error.</div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };

        // 2. Iterative AI Code Update
        window.updateSite = async () => {
            const editPrompt = document.getElementById('editPromptInput').value.trim();
            if (!editPrompt || !activeSubdomain || !activeRepo) return;

            const editInput = document.getElementById('editPromptInput');
            const loadingBar = document.getElementById('editLoading');
            const chatContainer = document.getElementById('chatHistory');
            
            editInput.value = '';
            editInput.disabled = true;
            loadingBar.classList.remove('hidden');
            
            chatContainer.innerHTML += `<div class="p-3 rounded-xl bg-surface border border-border text-textMain self-end max-w-[85%]">Updating: "${editPrompt}"</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`${WORKER_URL}update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: editPrompt, 
                        subdomain: activeSubdomain,
                        repoName: activeRepo 
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    chatContainer.innerHTML += `<div class="p-3 rounded-xl bg-surfaceHover border border-border text-emerald-400">Update successful! Refreshing live preview...</div>`;
                    document.getElementById('previewFrame').src = `https://${activeSubdomain}.textnexus.me?t=${Date.now()}`;
                } else {
                    chatContainer.innerHTML += `<div class="p-3 rounded-xl bg-red-950/40 border border-red-900/50 text-red-300">Update failed: ${data.error || 'Could not update site.'}</div>`;
                }
            } catch (err) {
                chatContainer.innerHTML += `<div class="p-3 rounded-xl bg-red-950/40 border border-red-900/50 text-red-300">Network error during update.</div>`;
            } finally {
                editInput.disabled = false;
                loadingBar.classList.add('hidden');
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        };
    </script>
</body>
</html>
