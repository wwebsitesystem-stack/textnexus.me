<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Creator</title>
    <style>
        /* Base styling for iframe/page body */
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Allows parent index.html background to show if iframed */
        }

        /* Styling to match the original TextNexus UI */
        .nexus-creator-panel {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 650px;
            color: #ffffff;
            padding: 20px;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
        }
        .header-text h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }
        .header-text p {
            color: #a1a1aa;
            font-size: 15px;
            margin: 0;
            line-height: 1.5;
            max-width: 300px;
        }
        .credits-badge {
            background: #18181b;
            border: 1px solid #27272a;
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .credits-badge span:first-child {
            font-size: 10px;
            font-weight: 600;
            color: #d4d4d8;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .credits-badge span:last-child {
            font-size: 16px;
            font-weight: 700;
            font-family: monospace;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #f4f4f5;
        }
        textarea, input[type="text"] {
            width: 100%;
            background-color: #09090b;
            border: 1px solid #27272a;
            color: #ffffff;
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        textarea:focus, input[type="text"]:focus {
            border-color: #52525b;
        }
        .input-group {
            display: flex;
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 8px;
            overflow: hidden;
        }
        .input-group input {
            border: none;
            border-radius: 0;
            flex-grow: 1;
        }
        .input-group .suffix {
            background-color: #18181b;
            padding: 14px 16px;
            color: #a1a1aa;
            font-size: 15px;
            border-left: 1px solid #27272a;
            font-family: monospace;
            display: flex;
            align-items: center;
        }
        button {
            width: 100%;
            background-color: #3b82f6; /* Matching the blue button from your UI */
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #statusBox {
            margin-top: 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="nexus-creator-panel">
    <div class="header-flex">
        <div class="header-text">
            <h1>Build with Nexus</h1>
            <p>AI generates code and deploys to a live Textnexus.me subdomain.</p>
        </div>
        <div class="credits-badge">
            <span>REMAINING CREDITS</span>
            <span>9,999,999,999,998,000</span>
        </div>
    </div>

    <div class="form-group">
        <label for="promptInput">Website Description:</label>
        <textarea id="promptInput" rows="5" placeholder="Describe the website you want to build..."></textarea>
    </div>

    <div class="form-group">
        <label for="subdomainInput">Subdomain:</label>
        <div class="input-group">
            <input type="text" id="subdomainInput" placeholder="e.g. my-cool-site">
            <div class="suffix">.textnexus.me</div>
        </div>
    </div>

    <button id="deployBtn" onclick="startDeployment()">
        Build & Deploy Website
    </button>

    <div id="statusBox"></div>
</div>

<script>
    async function startDeployment() {
        const promptText = document.getElementById("promptInput").value.trim();
        const subdomainText = document.getElementById("subdomainInput").value.trim();
        const statusBox = document.getElementById("statusBox");
        const deployBtn = document.getElementById("deployBtn");

        if (!promptText || !subdomainText) {
            statusBox.innerHTML = `
                <div style="background: #18181b; border: 1px solid #27272a; padding: 16px; border-radius: 8px; color: #f87171;">
                    Please enter both a description and a link.
                </div>`;
            return;
        }

        deployBtn.disabled = true;
        statusBox.innerHTML = `
            <div style="background: #18181b; border: 1px solid #27272a; padding: 16px; border-radius: 8px; color: #60a5fa;">
                Connecting to backend worker...
            </div>`;

        try {
            const response = await fetch("https://little-unit-9bae.brodywilliams0226.workers.dev/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: promptText, subdomain: subdomainText })
            });

            // 1. Capture raw text to trap JSON parsing errors
            const rawText = await response.text();
            
            if (!response.ok) {
                throw new Error(`HTTP Error ${response.status}: ${rawText}`);
            }

            // 2. Parse JSON safely
            let data;
            try {
                data = JSON.parse(rawText);
            } catch (err) {
                throw new Error(`Cloudflare sent invalid JSON: ${rawText}`);
            }

            // 3. Success UI
            statusBox.innerHTML = `
                <div style="background: #18181b; border: 1px solid #27272a; padding: 16px; border-radius: 8px;">
                    <div style="color: #4ade80; font-weight: 600; margin-bottom: 8px;">Deployment Started!</div>
                    Live URL: <a href="${data.siteUrl}" target="_blank" style="color: #60a5fa; text-decoration: none;">${data.siteUrl}</a><br>
                    <div style="color: #a1a1aa; font-size: 13px; margin-top: 8px;">GitHub Pages takes ~60 seconds to issue SSL. If you get a 404, please refresh in a minute.</div>
                </div>`;

        } catch (err) {
            // 4. PRINT REAL ERROR ON SCREEN
            statusBox.innerHTML = `
                <div style="background: #18181b; border: 1px solid #27272a; padding: 16px; border-radius: 8px; color: #f87171;">
                    <strong>Error:</strong> ${err.message}
                </div>`;
        } finally {
            deployBtn.disabled = false;
        }
    }
</script>

</body>
</html>
