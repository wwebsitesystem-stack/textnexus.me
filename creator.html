<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Creator Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#0a0a0a',
                        surface: '#121212',
                        surfaceHover: '#1c1c1c',
                        border: '#262626',
                        textMain: '#ededed',
                        textMuted: '#a1a1aa',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen w-screen flex flex-col bg-background text-textMain antialiased overflow-hidden">

    <!-- Top Bar -->
    <header class="h-16 flex items-center justify-between px-6 border-b border-border bg-surface shrink-0">
        <div class="flex items-center gap-4">
            <a href="index.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-border text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors text-sm font-medium">
                <i class="ph ph-arrow-left text-base"></i> Back to Nexus
            </a>
            <span class="font-medium text-sm text-textMain">Nexus Creator Workspace</span>
        </div>
        <div class="flex items-center gap-4">
            <div id="creditDisplay" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-surfaceHover border border-border text-emerald-400">
                Credits: Loading...
            </div>
        </div>
    </header>

    <!-- Main Workspace Split View -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Panel: AI Prompt & Chat History -->
        <div class="w-96 border-r border-border bg-surface flex flex-col shrink-0">
            <div id="chatHistory" class="flex-1 p-5 overflow-y-auto flex flex-col gap-4 text-sm">
                <div class="p-3.5 rounded-xl bg-surfaceHover border border-border text-textMuted leading-relaxed">
                    Welcome to the Creator Workspace! Describe your website, enter your subdomain, and generate a custom AI site. Each build costs <span class="text-textMain font-semibold">1,000 credits</span> and remains active for 7 days.
                </div>
            </div>

            <div class="p-4 border-t border-border bg-background flex flex-col gap-3">
                <input type="text" id="subdomainInput" placeholder="Subdomain (e.g. mysite)" class="w-full bg-surface border border-border rounded-lg px-3.5 py-2.5 text-sm text-textMain focus:outline-none focus:border-zinc-500 placeholder:text-zinc-600">
                <textarea id="promptInput" rows="3" placeholder="What kind of website do you want to build?" class="w-full bg-surface border border-border rounded-lg px-3.5 py-2.5 text-sm text-textMain focus:outline-none focus:border-zinc-500 placeholder:text-zinc-600 resize-none"></textarea>
                <button onclick="startBuild()" class="w-full bg-textMain text-background font-semibold py-2.5 rounded-lg text-sm hover:bg-zinc-200 transition-colors">
                    Build Website (1,000 Credits)
                </button>
            </div>
        </div>

        <!-- Right Panel: Live Preview Frame -->
        <div class="flex-1 bg-background flex items-center justify-center relative">
            <div id="previewPlaceholder" class="flex flex-col items-center gap-2 text-textMuted text-sm">
                <i class="ph ph-globe text-3xl text-zinc-700"></i>
                <p>Your live website preview will load here once generated.</p>
            </div>
            <iframe id="previewFrame" class="w-full h-full border-none hidden bg-white"></iframe>
        </div>
    </div>

    <!-- Firebase & Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const app = initializeApp({
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com"
        });
        const auth = getAuth(app);

        // Check Authentication & Credits on Load
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                alert("Please log in from the main Nexus dashboard first.");
                window.location.href = "index.html";
                return;
            }

            // Manage local credit storage per user account
            let credits = localStorage.getItem(`nexus_credits_${user.uid}`);
            if (credits === null) {
                credits = '10000'; // Default starting credit balance
                localStorage.setItem(`nexus_credits_${user.uid}`, credits);
            }
            document.getElementById('creditDisplay').innerText = `Credits: ${parseInt(credits).toLocaleString()}`;
        });

        window.startBuild = async () => {
            const user = auth.currentUser;
            if (!user) {
                alert("You must be logged in.");
                return;
            }

            const subdomain = document.getElementById('subdomainInput').value.trim();
            const prompt = document.getElementById('promptInput').value.trim();
            const chatContainer = document.getElementById('chatHistory');
            const previewPlaceholder = document.getElementById('previewPlaceholder');
            const previewFrame = document.getElementById('previewFrame');

            if (!subdomain || !prompt) {
                alert("Please provide both a subdomain and an AI prompt.");
                return;
            }

            let credits = parseInt(localStorage.getItem(`nexus_credits_${user.uid}`) || '0');
            if (credits < 1000) {
                alert("Insufficient credits! You need at least 1,000 credits to build a website.");
                return;
            }

            // Append user prompt to chat
            chatContainer.innerHTML += `<div class="p-3 rounded-xl bg-surface border border-border text-textMain self-end max-w-[85%]">Building: "${prompt}" (${subdomain}.textnexus.me)</div>`;
            chatContainer.innerHTML += `<div id="loadingMsg" class="p-3 rounded-xl bg-surfaceHover border border-border text-textMuted">Configuring DNS, building repo, and setting up Firebase...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('https://little-unit-9bae.brodywilliams0226.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, subdomain, userCredits: credits })
                });

                const data = await response.json();
                document.getElementById('loadingMsg').remove();

                if (response.ok) {
                    // Deduct 1,000 credits
                    credits -= 1000;
                    localStorage.setItem(`nexus_credits_${user.uid}`, credits);
                    document.getElementById('creditDisplay').innerText = `Credits: ${credits.toLocaleString()}`;

                    chatContainer.innerHTML += `<div class="p-3 rounded-xl bg-surfaceHover border border-border text-textMain">Success! Your site is live at <a href="${data.siteUrl}" target="_blank" class="text-blue-400 underline">${data.siteUrl}</a>.<br><span class="text-xs text-textMuted mt-1 block">Active for 7 days. To renew, email nexus.web.solutions@putlook.com</span></div>`;

                    // Load live preview
                    previewPlaceholder.classList.add('hidden');
                    previewFrame.classList.remove('hidden');
                    previewFrame.src = data.siteUrl;
                } else {
                    chatContainer.innerHTML += `<div class="p-3 rounded-xl bg-red-950/40 border border-red-900/50 text-red-300">Error: ${data.error || 'Build failed.'}</div>`;
                }
            } catch (err) {
                if (document.getElementById('loadingMsg')) document.getElementById('loadingMsg').remove();
                chatContainer.innerHTML += `<div class="p-3 rounded-xl bg-red-950/40 border border-red-900/50 text-red-300">Network connection error.</div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };
    </script>
</body>
</html>
