<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Builder</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #statusBox {
            margin-top: 24px;
            padding: 16px;
            border-radius: 6px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        a {
            color: #60a5fa;
        }
    </style>
</head>
<body>

    <h1>Build with Nexus</h1>

    <div class="form-group">
        <label for="promptInput">Website Description:</label>
        <textarea id="promptInput" rows="4" placeholder="Describe the website you want to build..."></textarea>
    </div>

    <div class="form-group">
        <label for="subdomainInput">Subdomain:</label>
        <input type="text" id="subdomainInput" placeholder="e.g. my-cool-site">
    </div>

    <button id="deployBtn" onclick="startDeployment()">Build & Deploy Website</button>

    <div id="statusBox"></div>

    <script>
        async function startDeployment() {
            const promptText = document.getElementById("promptInput").value.trim();
            const subdomainText = document.getElementById("subdomainInput").value.trim();
            const statusBox = document.getElementById("statusBox");
            const deployBtn = document.getElementById("deployBtn");

            // Basic validation
            if (!promptText || !subdomainText) {
                statusBox.innerHTML = '<div style="color: #f87171; background: rgba(248, 113, 113, 0.1); padding: 12px; border-radius: 6px;">Please enter both a description and a subdomain.</div>';
                return;
            }

            try {
                // Disable button and show loading state
                deployBtn.disabled = true;
                statusBox.innerHTML = '<div style="color: #60a5fa; background: rgba(96, 165, 250, 0.1); padding: 12px; border-radius: 6px;">Connecting to backend worker... Please wait.</div>';

                // Call the Cloudflare Worker
                const response = await fetch("https://little-unit-9bae.brodywilliams0226.workers.dev/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        prompt: promptText,
                        subdomain: subdomainText
                    })
                });

                // 1. Get the raw text first before trying to parse JSON
                const rawText = await response.text();
                
                // 2. Check if the response was an HTTP error
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}: ${rawText}`);
                }

                // 3. Try parsing the JSON safely
                let data;
                try {
                    data = JSON.parse(rawText);
                } catch (parseErr) {
                    throw new Error(`Failed to parse JSON response: ${rawText}`);
                }

                // Success! Render the links.
                statusBox.innerHTML = `
                    <div style="color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 16px; border-radius: 8px; border: 1px solid rgba(74, 222, 128, 0.2);">
                        <strong>Deployment Started!</strong><br><br>
                        Live URL: <a href="${data.siteUrl}" target="_blank">${data.siteUrl}</a><br>
                        GitHub Repo: <a href="${data.repoUrl}" target="_blank">View Code</a><br><br>
                        <span style="color: #9ca3af; font-size: 14px;">Note: GitHub Pages takes about 1 to 2 minutes to generate the SSL certificate. If the link shows a 404, refresh in a minute.</span>
                    </div>
                `;

            } catch (err) {
                // This catches the exact local error and displays it
                statusBox.innerHTML = `
                    <div style="color: #f87171; background: rgba(248, 113, 113, 0.1); padding: 16px; border-radius: 8px; border: 1px solid rgba(248, 113, 113, 0.2);">
                        <strong>Error:</strong> ${err.message}
                    </div>
                `;
            } finally {
                // Re-enable the button
                deployBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
