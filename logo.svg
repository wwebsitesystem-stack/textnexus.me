<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
  <g transform="translate(20, 20)">
    <!-- Central Node -->
    <circle cx="40" cy="40" r="8" fill="#ffffff" stroke="url(#grad1)" stroke-width="3"/>
    
    <!-- Top Left Node -->
    <circle cx="10" cy="10" r="6" fill="url(#grad1)"/>
    <!-- Line from Top Left to Center -->
    <line x1="10" y1="10" x2="40" y2="40" stroke="url(#grad1)" stroke-width="2"/>
    
    <!-- Bottom Right Node -->
    <circle cx="70" cy="70" r="6" fill="url(#grad1)"/>
    <!-- Line from Center to Bottom Right -->
    <line x1="40" y1="40" x2="70" y2="70" stroke="url(#grad1)" stroke-width="2"/>
    
    <!-- Top Right Node -->
    <circle cx="70" cy="10" r="6" fill="url(#grad1)"/>
    <!-- Line from Top Right to Center -->
    <line x1="70" y1="10" x2="40" y2="40" stroke="url(#grad1)" stroke-width="2"/>
    
    <!-- Bottom Left Node -->
    <circle cx="10" cy="70" r="6" fill="url(#grad1)"/>
    <!-- Line from Bottom Left to Center -->
    <line x1="10" y1="70" x2="40" y2="40" stroke="url(#grad1)" stroke-width="2"/>
    
    <!-- Outer Ring Suggestion (Abstract N Shape via connections) -->
    <path d="M10,10 L10,70 M70,10 L70,70" stroke="url(#grad1)" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Text Part -->
  <text x="120" y="95" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="bold" fill="#1e293b">
    Nexus
  </text>
</svg>
