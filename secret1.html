<!DOCTYPE html>
<html lang="en" data-season="thanksgiving">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <style>
        /* Base Styling & Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        aside {
            width: 260px;
            background-color: #1a1a1e;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #29292e;
        }

        .logo h1 {
            font-size: 1.5rem;
            color: #8257e5;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-menu {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .game-menu li {
            margin-bottom: 8px;
        }

        .game-item {
            display: block;
            width: 100%;
            padding: 12px 15px;
            background: transparent;
            color: #a8a8b3;
            border: none;
            border-radius: 6px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .game-item:hover, .game-item.active {
            background-color: #8257e5;
            color: #ffffff;
        }

        /* Main Screen Container */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #121214;
        }

        /* Top Header */
        header {
            height: 70px;
            background-color: #1a1a1e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 2px solid #29292e;
        }

        header h2 {
            font-size: 1.25rem;
            font-weight: 500;
        }

        .home-btn {
            background-color: #29292e;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .home-btn:hover {
            background-color: #3e3e46;
        }

        /* Viewport Panels */
        .content-panel {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* Home View (Grid View) */
        #home-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: #1a1a1e;
            border: 2px solid #29292e;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #8257e5;
        }

        .game-thumbnail {
            width: 70px;
            height: 70px;
            background-color: #29292e;
            border-radius: 12px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .game-card p {
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Game Display View */
        #game-view {
            display: none;
            height: 100%;
            width: 100%;
            padding: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000000;
        }
    </style>
    <link rel="stylesheet" href="thanksgiving.css">
    <script src="season.js"></script>
</head>
<body>

    <!-- Sidebar Menu -->
    <aside>
        <div class="logo">
            <h1>Unblocked Games</h1>
        </div>
        <ul class="game-menu">
            <li><button class="game-item" onclick="loadGame('Slope', 'https://github.io')">Slope</button></li>
            <li><button class="game-item" onclick="loadGame('2048', 'https://github.io')">2048</button></li>
            <li><button class="game-item" onclick="loadGame('Retro Bowl', 'https://github.io')">Retro Bowl</button></li>
            <li><button class="game-item" onclick="loadGame('Subway Surfers', 'https://superteamxx.github.io/Subway-Surfers/')">Subway Surfers</button></li>
        </ul>
    </aside>

    <!-- Main Content Area -->
    <main>
        <header>
            <h2 id="current-title">Dashboard</h2>
            <button class="home-btn" onclick="showHome()">Back to Home</button>
        </header>

        <!-- Dynamic Content -->
        <div class="content-panel">
            
            <!-- Home Dashboard (Grid of Games) -->
            <div id="home-view">
                <div class="game-card" onclick="loadGame('Slope', 'https://github.io')">
                    <div class="game-thumbnail">🟢</div>
                    <p>Slope</p>
                </div>
                <div class="game-card" onclick="loadGame('2048', 'https://github.io')">
                    <div class="game-thumbnail">🔢</div>
                    <p>2048</p>
                </div>
                <div class="game-card" onclick="loadGame('Retro Bowl', 'https://github.io')">
                    <div class="game-thumbnail">🏈</div>
                    <p>Retro Bowl</p>
                </div>
                <div class="game-card" onclick="loadGame('Subway Surfers', 'https://superteamxx.github.io/Subway-Surfers/')">
                    <div class="game-thumbnail">🏄‍♂️</div>
                    <p>Subway Surfers</p>
                </div>
            </div>

            <!-- Iframe Container for Active Game -->
            <div id="game-view">
                <iframe id="game-frame" src="" allowfullscreen></iframe>
            </div>

        </div>
    </main>

    <!-- UI Logic Controller -->
    <script>
        const homeView = document.getElementById('home-view');
        const gameView = document.getElementById('game-view');
        const gameFrame = document.getElementById('game-frame');
        const currentTitle = document.getElementById('current-title');
        const menuButtons = document.querySelectorAll('.game-item');

        function loadGame(name, url) {
            homeView.style.display = 'none';
            gameView.style.display = 'block';
            
            gameFrame.src = url;
            currentTitle.textContent = name;

            menuButtons.forEach(btn => {
                if (btn.textContent === name) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function showHome() {
            gameFrame.src = "";
            gameView.style.display = 'none';
            homeView.style.display = 'grid';
            currentTitle.textContent = 'Dashboard';
            menuButtons.forEach(btn => btn.classList.remove('active'));
        }
    </script>
</body>
</html>
