<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Games has moved | TextNexus</title>
  <meta name="description" content="The games table is no longer part of TextNexus. Continue to the workspace home.">
  <link rel="canonical" href="https://textnexus.me/home.html">
  <meta http-equiv="refresh" content="0; url=/home.html">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a0a0a">
  <style>
    :root {
      --bg: #0a0a0a;
      --line: rgba(255, 255, 255, 0.09);
      --text: #ededed;
      --muted: #a1a1aa;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 430px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #121212;
      padding: 30px 28px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 8px; font-size: 19px; line-height: 1.3; letter-spacing: -0.01em; }
    p { margin: 0 0 20px; font-size: 13px; line-height: 1.6; color: var(--muted); }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      border-radius: 9px;
      background: var(--text);
      color: #000;
      padding: 11px 16px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }
    a.btn:hover { opacity: 0.9; }
    a.plain { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Page retired</span>
    <h1>The games table has closed.</h1>
    <p>This page is no longer part of TextNexus. Taking you to the workspace home &mdash; or continue from <a class="plain" href="/home.html">home</a>.</p>
    <a class="btn" href="/home.html">Go to the workspace home</a>
  </main>
  <script>location.replace("/home.html" + location.hash);</script>
</body>
</html>
