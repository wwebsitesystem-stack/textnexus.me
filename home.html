<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Home</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#0a0a0a',
                        surface: '#121212',
                        border: '#262626',
                        textMain: '#ededed',
                        textMuted: '#a1a1aa'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: transparent; color: #ededed; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
    </style>
</head>
<body class="w-full h-full p-8 md:p-12 overflow-y-auto">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-semibold text-textMain tracking-tight mb-8">Overview</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Welcome Widget -->
            <div class="bg-surface border border-border p-6 rounded-xl flex flex-col justify-between h-48">
                <div>
                    <h2 class="text-sm font-medium text-textMain mb-1">Welcome to Nexus</h2>
                    <p class="text-xs text-textMuted">Your workspace is active and fully functional.</p>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-xs font-medium text-textMuted">System Online</span>
                </div>
            </div>

            <!-- Quick Links / Info Widget -->
            <div class="bg-surface border border-border p-6 rounded-xl h-48 flex flex-col gap-4">
                <h2 class="text-sm font-medium text-textMain">Quick Access</h2>
                <div class="flex flex-col gap-2">
                    <div class="flex items-center gap-3 text-sm text-textMuted p-2 rounded-lg bg-background border border-border">
                        <i class="ph ph-bell text-lg"></i> Check the Updates tab for recent news.
                    </div>
                    <div class="flex items-center gap-3 text-sm text-textMuted p-2 rounded-lg bg-background border border-border">
                        <i class="ph ph-ghost text-lg"></i> Secure your files in Ghostlink.
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // Theme Listener
        const savedColor = localStorage.getItem('nexus-brand-color');
        if(savedColor) document.documentElement.style.setProperty('--brand-color', savedColor);
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'update-theme') {
                document.documentElement.style.setProperty('--brand-color', event.data.color);
            }
        });
    </script>
</body>
</html>
