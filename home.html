<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Overview | TextNexus</title>
    <meta name="description" content="Your Nexus workspace overview: system status, quick access to updates, Ghostlink and the admin panel.">
    <link rel="canonical" href="https://textnexus.me/home.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TextNexus">
    <meta property="og:title" content="Workspace Overview | TextNexus">
    <meta property="og:description" content="Your Nexus workspace overview: system status, quick access to updates, Ghostlink and the admin panel.">
    <meta property="og:url" content="https://textnexus.me/home.html">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Workspace Overview | TextNexus">
    <meta name="twitter:description" content="Your Nexus workspace overview: system status, quick access to updates, Ghostlink and the admin panel.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#0a0a0a',
                        surface: '#121212',
                        border: '#262626',
                        textMain: '#ededed',
                        textMuted: '#a1a1aa'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: transparent; color: #ededed; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
    </style>

    <!-- Dynamic Theme Stylesheet Tag -->
    <link id="theme-stylesheet" rel="stylesheet" href="">
</head>
<body class="w-full h-full p-8 md:p-12 overflow-y-auto">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-semibold text-textMain tracking-tight mb-8">Overview</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Welcome Widget -->
            <div class="bg-surface border border-border p-6 rounded-xl flex flex-col justify-between h-48">
                <div>
                    <h2 class="text-sm font-medium text-textMain mb-1">Welcome to Nexus</h2>
                    <p class="text-xs text-textMuted">Your workspace is active and fully functional.</p>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-xs font-medium text-textMuted">System Online</span>
                </div>
            </div>

            <!-- Quick Links / Info Widget -->
            <div class="bg-surface border border-border p-6 rounded-xl h-auto flex flex-col gap-4">
                <h2 class="text-sm font-medium text-textMain">Quick Access</h2>
                <div class="flex flex-col gap-2">
                    <div class="flex items-center gap-3 text-sm text-textMuted p-2 rounded-lg bg-background border border-border">
                        <i class="ph ph-bell text-lg"></i> Check the Updates tab for recent news.
                    </div>
                    <div class="flex items-center gap-3 text-sm text-textMuted p-2 rounded-lg bg-background border border-border">
                        <i class="ph ph-ghost text-lg"></i> Secure your files in Ghostlink.
                    </div>
                    <a href="admin.html" onclick="return openInShell(event, 'admin.html')" class="flex items-center gap-3 text-sm text-textMuted p-2 rounded-lg bg-background border border-border hover:border-textMuted transition-colors">
                        <i class="ph ph-shield-check text-lg"></i> Open the Admin Panel.
                    </a>
                    <a href="signup.html" class="flex items-center gap-3 text-sm text-textMuted p-2 rounded-lg bg-background border border-border hover:border-textMuted transition-colors">
                        <i class="ph ph-user-plus text-lg"></i> Create an account.
                    </a>
                </div>
            </div>
            
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref as dbRef, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const app = initializeApp({
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com" 
        });
        const db = getDatabase(app);

        // Realtime Theme Listener
        const themeStylesheet = document.getElementById('theme-stylesheet');
        const themeRef = dbRef(db, 'system/theme');

        onValue(themeRef, (snapshot) => {
            const themeVal = snapshot.val();
            if (themeVal && themeVal !== 'default' && themeVal !== 'none') {
                let themePath = themeVal.trim();
                if (!themePath.endsWith('.css')) {
                    themePath = `themes/${themePath}.css`;
                } else if (!themePath.startsWith('themes/')) {
                    themePath = `themes/${themePath}`;
                }
                themeStylesheet.href = themePath;
            } else {
                themeStylesheet.href = '';
            }
        });

        // Open a route in the Nexus shell when embedded, otherwise navigate directly
        window.openInShell = function (event, route) {
            const shell = window.parent;
            if (shell && shell !== window && typeof shell.loadRoute === 'function') {
                shell.loadRoute(route);
                event.preventDefault();
                return false;
            }
            return true;
        };

        // Brand Color Listener
        const savedColor = localStorage.getItem('nexus-brand-color');
        if(savedColor) document.documentElement.style.setProperty('--brand-color', savedColor);
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'update-theme') {
                document.documentElement.style.setProperty('--brand-color', event.data.color);
            }
        });
    </script>

<!-- Announcement bar: text comes from system/announcement -->
<div id="tn-announce" hidden style="position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 44px 9px 16px;background:#fff;color:#000;font:600 13px/1.4 'Inter',-apple-system,sans-serif;text-align:center">
  <span id="tn-announce-text"></span>
  <a id="tn-announce-link" href="/updates.html" style="color:#000;text-decoration:underline">Learn more</a>
  <button id="tn-announce-close" aria-label="Dismiss" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:17px;line-height:1;cursor:pointer;color:#000">×</button>
</div>
<script type="module">
  (async () => {
    const bar = document.getElementById('tn-announce');
    if (!bar || sessionStorage.getItem('tn-announce-dismissed') === '1') return;
    const show = (text, link) => {
      if (!text) return;
      document.getElementById('tn-announce-text').textContent = text;
      if (link) document.getElementById('tn-announce-link').href = link;
      bar.hidden = false;
    };
    show('A new update lands tomorrow.', '/updates.html');
    try {
      const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
      const { getDatabase, ref, onValue } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js');
      const app = getApps().length ? getApps()[0] : initializeApp({
        apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
        authDomain: "nexus-web-development-official.firebaseapp.com",
        projectId: "nexus-web-development-official",
        databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com"
      });
      onValue(ref(getDatabase(app), 'system/announcement'), (snap) => {
        const a = snap.val();
        if (!a) return;
        if (a.enabled === false) { bar.hidden = true; return; }
        show(a.text || 'A new update lands tomorrow.', a.link || '/updates.html');
      });
    } catch { /* rules unpublished: keep the default banner */ }
    document.getElementById('tn-announce-close').addEventListener('click', () => {
      bar.hidden = true;
      sessionStorage.setItem('tn-announce-dismissed', '1');
    });
    document.body.style.paddingTop = bar.offsetHeight + 'px';
  })();
</script>
</body>
</html>
