<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Updates</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#0a0a0a',
                        surface: '#121212',
                        border: '#262626',
                        textMain: '#ededed',
                        textMuted: '#a1a1aa'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: transparent; color: #ededed; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
    </style>
</head>
<body class="w-full h-full p-8 md:p-12 overflow-y-auto">

    <div class="max-w-3xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-2xl font-semibold text-textMain tracking-tight">Updates</h1>
            <div class="flex items-center gap-2 text-xs text-textMuted">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live
            </div>
        </div>

        <!-- Read-Only Feed Container -->
        <div id="updates-feed" class="flex flex-col gap-4">
            <div class="text-sm text-textMuted">Loading workspace updates...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref as dbRef, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const updatesRef = dbRef(db, 'workspace_updates');
        const feedContainer = document.getElementById('updates-feed');

        // Real-time Feed Listener
        onValue(updatesRef, (snapshot) => {
            feedContainer.innerHTML = ''; 
            const data = snapshot.val();
            
            if (!data) {
                feedContainer.innerHTML = '<div class="p-8 text-center text-sm text-textMuted bg-surface rounded-xl border border-border">No updates posted yet.</div>';
                return;
            }

            const updatesArray = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            updatesArray.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            updatesArray.forEach(update => {
                const timeString = update.timestamp 
                    ? new Date(update.timestamp).toLocaleDateString([], { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' }) 
                    : 'Just now';
                
                let imageHtml = '';
                if (update.imageUrl) {
                    imageHtml = `<img src="${update.imageUrl}" loading="lazy" class="mt-4 rounded-lg border border-border max-w-full md:max-w-md object-cover">`;
                }

                const item = document.createElement('div');
                item.className = 'bg-surface border border-border p-5 rounded-xl transition-all';
                item.innerHTML = `
                    <div class="flex items-center gap-3 mb-3">
                        <img src="IMG_0728.jpeg" alt="Brody Williams" class="w-10 h-10 rounded-full object-cover shrink-0 border border-border">
                        <div class="flex flex-col">
                            <div class="flex items-center gap-2">
                                <p class="text-sm font-medium text-textMain">Brody Williams</p>
                                <span class="text-[9px] uppercase tracking-wider bg-[var(--brand-color)]/10 text-[var(--brand-color)] border border-[var(--brand-color)]/20 px-1.5 py-0.5 rounded-md font-bold">Owner</span>
                            </div>
                            <p class="text-[11px] text-textMuted mt-0.5">${timeString}</p>
                        </div>
                    </div>
                    ${update.text ? `<p class="text-sm text-textMain whitespace-pre-wrap leading-relaxed">${update.text}</p>` : ''}
                    ${imageHtml}
                `;
                feedContainer.appendChild(item);
            });
        });

        // Theme sync listener
        const savedColor = localStorage.getItem('nexus-brand-color');
        if(savedColor) document.documentElement.style.setProperty('--brand-color', savedColor);
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'update-theme') {
                document.documentElement.style.setProperty('--brand-color', event.data.color);
            }
        });
    </script>
</body>
</html>
