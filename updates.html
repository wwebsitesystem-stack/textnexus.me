<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Updates - Nexus</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#0a0a0a',
                        surface: '#121212',
                        surfaceHover: '#1c1c1c',
                        border: '#262626',
                        textMain: '#ededed',
                        textMuted: '#a1a1aa'
                    }
                }
            }
        }
    </script>
    <style>
        :root { --brand-color: #ededed; }
        body { background-color: transparent; color: #ededed; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        
        /* Subtle animation for new posts */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .update-card { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="w-full h-full flex flex-col overflow-hidden bg-background">

    <!-- Header -->
    <header class="h-16 border-b border-border flex items-center px-8 bg-surface shrink-0 z-10 sticky top-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-[var(--brand-color)]/10 flex items-center justify-center text-[var(--brand-color)] border border-[var(--brand-color)]/20">
                <i class="ph ph-bell-ringing text-lg"></i>
            </div>
            <div>
                <h2 class="font-semibold text-textMain text-sm">Workspace Updates</h2>
                <p class="text-[11px] text-textMuted">Official announcements and patch notes</p>
            </div>
        </div>
    </header>

    <!-- Main Scrollable Area -->
    <main class="flex-1 overflow-y-auto p-8 relative">
        <div class="max-w-3xl mx-auto flex flex-col gap-6" id="updates-container">
            
            <!-- Loading State -->
            <div id="loading-state" class="flex flex-col items-center justify-center py-20 text-textMuted gap-3">
                <i class="ph ph-spinner animate-spin text-3xl"></i>
                <p class="text-xs font-medium">Fetching updates...</p>
            </div>

            <!-- Empty State (Hidden by default) -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-textMuted gap-3 text-center border border-dashed border-border rounded-xl bg-surface/50">
                <i class="ph ph-envelope-simple-open text-4xl mb-2 opacity-50"></i>
                <h3 class="text-sm font-semibold text-textMain">No Updates Yet</h3>
                <p class="text-xs">Check back later for official announcements and patch notes.</p>
            </div>

            <!-- Posts inject here dynamically -->
            <div id="posts-list" class="flex flex-col gap-6"></div>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref as dbRef, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const container = document.getElementById('posts-list');
        const loadingState = document.getElementById('loading-state');
        const emptyState = document.getElementById('empty-state');

        // Helper: Format Timestamp
        function formatTime(timestamp) {
            if (!timestamp) return 'Just now';
            const date = new Date(timestamp);
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            });
        }

        // Listen for Updates
        onValue(dbRef(db, 'workspace_updates'), (snapshot) => {
            loadingState.classList.add('hidden');
            container.innerHTML = '';
            
            const data = snapshot.val();

            if (!data) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            // Convert to array and sort newest first
            const posts = Object.keys(data)
                .map(key => ({ id: key, ...data[key] }))
                .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            posts.forEach((post, index) => {
                const article = document.createElement('article');
                article.className = 'update-card bg-surface border border-border rounded-xl p-6 shadow-xl relative overflow-hidden';
                article.style.animationDelay = `${index * 0.05}s`; // Staggered fade in
                
                // Add brand color accent bar
                const accentBar = document.createElement('div');
                accentBar.className = 'absolute top-0 left-0 w-full h-1 bg-[var(--brand-color)] opacity-80';
                article.appendChild(accentBar);

                article.innerHTML += `
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <h3 class="text-base font-bold text-textMain leading-tight">${post.title}</h3>
                        <span class="shrink-0 text-[10px] font-mono text-textMuted bg-surfaceHover px-2 py-1 rounded border border-border flex items-center gap-1.5">
                            <i class="ph ph-clock"></i> ${formatTime(post.timestamp)}
                        </span>
                    </div>
                    
                    <div class="text-sm text-textMuted leading-relaxed whitespace-pre-wrap mb-6 border-l-2 border-border pl-4">
                        ${post.content}
                    </div>
                    
                    <div class="flex items-center gap-2 border-t border-border pt-4">
                        <div class="w-6 h-6 rounded-full bg-surfaceHover border border-border flex items-center justify-center text-textMuted">
                            <i class="ph ph-user text-xs"></i>
                        </div>
                        <p class="text-xs text-textMuted font-medium">
                            Posted by <span class="text-textMain">${post.authorName || 'Nexus Admin'}</span>
                        </p>
                        ${post.authorEmail === 'brodywilliams0226@gmail.com' ? 
                            `<span class="ml-2 text-[9px] bg-[var(--brand-color)]/10 text-[var(--brand-color)] border border-[var(--brand-color)]/20 px-1.5 py-0.5 rounded uppercase font-bold tracking-wider">System Owner</span>` 
                            : ''
                        }
                    </div>
                `;
                container.appendChild(article);
            });
        });

        // Theme Sync
        const savedColor = localStorage.getItem('nexus-brand-color');
        if (savedColor) document.documentElement.style.setProperty('--brand-color', savedColor);
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'update-theme') {
                document.documentElement.style.setProperty('--brand-color', event.data.color);
            }
        });
    </script>
</body>
</html>
