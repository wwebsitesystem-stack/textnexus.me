<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Updates</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#0a0a0a',
                        surface: '#121212',
                        surfaceHover: '#1c1c1c',
                        border: '#262626',
                        textMain: '#ededed',
                        textMuted: '#a1a1aa',
                        brand: 'var(--brand-color, #ededed)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: transparent; color: #ededed; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
    </style>
</head>
<body class="w-full h-full p-8 md:p-12 overflow-y-auto">

    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-semibold text-textMain tracking-tight mb-8">Updates</h1>

        <!-- Upload Form -->
        <div class="mb-10 bg-surface border border-border p-4 rounded-xl flex flex-col gap-3">
            <textarea id="update-text" rows="2" placeholder="What's happening?" class="w-full bg-transparent border-none outline-none text-sm text-textMain placeholder:text-textMuted resize-none"></textarea>
            
            <div class="flex items-center justify-between border-t border-border pt-3">
                <div class="flex items-center gap-2">
                    <label class="cursor-pointer text-textMuted hover:text-textMain transition-colors flex items-center gap-2 text-sm">
                        <i class="ph ph-image text-lg"></i>
                        <span id="file-name">Attach Image</span>
                        <input type="file" id="update-image" accept="image/*" class="hidden">
                    </label>
                </div>
                <button id="post-btn" class="px-5 py-2 rounded-lg bg-textMain text-background hover:opacity-90 text-sm font-medium transition-opacity flex items-center gap-2">
                    Post Update
                </button>
            </div>
            <p id="upload-status" class="text-xs text-[var(--brand-color)] hidden"></p>
        </div>

        <!-- Feed Container -->
        <div id="updates-feed" class="flex flex-col gap-4">
            <div class="text-sm text-textMuted">Loading updates...</div>
        </div>
    </div>

    <script type="module">
        // Import Core, Database, and Storage
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref as dbRef, onValue, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
            storageBucket: "nexus-web-development-official.firebasestorage.app", // Adjust if your bucket URL differs slightly
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);
        const updatesRef = dbRef(db, 'workspace_updates');

        // --- UI ELEMENTS ---
        const textInput = document.getElementById('update-text');
        const imageInput = document.getElementById('update-image');
        const fileNameDisplay = document.getElementById('file-name');
        const postBtn = document.getElementById('post-btn');
        const statusText = document.getElementById('upload-status');
        const feedContainer = document.getElementById('updates-feed');

        imageInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) fileNameDisplay.textContent = e.target.files[0].name;
            else fileNameDisplay.textContent = "Attach Image";
        });

        // --- FETCH & DISPLAY FEED ---
        onValue(updatesRef, (snapshot) => {
            feedContainer.innerHTML = ''; 
            const data = snapshot.val();
            
            if (!data) {
                feedContainer.innerHTML = '<div class="text-sm text-textMuted">No updates yet.</div>';
                return;
            }

            const updatesArray = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            updatesArray.sort((a, b) => b.timestamp - a.timestamp);

            updatesArray.forEach(update => {
                const timeString = update.timestamp ? new Date(update.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just now';
                
                let imageHtml = '';
                if (update.imageUrl) {
                    imageHtml = `<img src="${update.imageUrl}" loading="lazy" class="mt-3 rounded-lg border border-border max-w-full md:max-w-md object-cover">`;
                }

                const item = document.createElement('div');
                item.className = 'bg-surface border border-border p-5 rounded-xl';
                item.innerHTML = `
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-8 h-8 rounded-full bg-border flex items-center justify-center text-textMuted shrink-0">
                            <i class="ph ph-user text-sm"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-textMain">Admin</p>
                            <p class="text-xs text-textMuted">${timeString}</p>
                        </div>
                    </div>
                    <p class="text-sm text-textMain whitespace-pre-wrap">${update.text}</p>
                    ${imageHtml}
                `;
                feedContainer.appendChild(item);
            });
        });

        // --- UPLOAD LOGIC ---
        postBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            const file = imageInput.files[0];

            if (!text && !file) return;

            postBtn.disabled = true;
            postBtn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Posting...';
            statusText.classList.remove('hidden');
            statusText.classList.replace('text-red-400', 'text-[var(--brand-color)]');
            
            let downloadUrl = null;

            try {
                // 1. Upload Image to Firebase Storage if attached
                if (file) {
                    statusText.textContent = "Uploading image to Firebase...";
                    // Create a unique file name so images don't overwrite each other
                    const uniqueFileName = `updates/${Date.now()}_${file.name}`;
                    const imageRef = storageRef(storage, uniqueFileName);
                    
                    // Upload the file
                    const snapshot = await uploadBytes(imageRef, file);
                    
                    // Get the public URL for the image
                    downloadUrl = await getDownloadURL(snapshot.ref);
                }

                statusText.textContent = "Saving post...";

                // 2. Save text and image URL to Realtime Database
                await push(updatesRef, {
                    text: text,
                    timestamp: serverTimestamp(),
                    imageUrl: downloadUrl // Saves the Firebase Storage URL instead of Cloudflare ID
                });

                // 3. Reset form
                textInput.value = '';
                imageInput.value = '';
                fileNameDisplay.textContent = "Attach Image";
                statusText.classList.add('hidden');

            } catch (error) {
                console.error(error);
                statusText.textContent = "Error: " + error.message;
                statusText.classList.replace('text-[var(--brand-color)]', 'text-red-400');
            } finally {
                postBtn.disabled = false;
                postBtn.innerHTML = 'Post Update';
            }
        });

        // Theme sync
        const savedColor = localStorage.getItem('nexus-brand-color');
        if(savedColor) document.documentElement.style.setProperty('--brand-color', savedColor);
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'update-theme') {
                document.documentElement.style.setProperty('--brand-color', event.data.color);
            }
        });
    </script>
</body>
</html>
