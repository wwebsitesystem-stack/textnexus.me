<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Web Solutions - AI Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Nexus Web Solutions</h1>
    <p>Describe your website, and our AI will build and deploy it live.</p>
      
    <div class="generator-box">
      <label for="site-prompt">What should the website look like?</label>
      <textarea id="site-prompt" rows="4" placeholder="A futuristic dark-mode landing page for a tech startup..."></textarea>
      
      <label for="subdomain-name">Choose your link (e.g., typing 'coolsite' makes coolsite.textnexus.me):</label>
      <input type="text" id="subdomain-name" placeholder="my-new-site">

      <button id="generate-btn">Build & Deploy Website</button>
    </div>

    <div id="status-output"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
