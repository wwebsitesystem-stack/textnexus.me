server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Compress text assets on the fly.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Pages change on every deploy, so make browsers revalidate them.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # Styles, scripts and icons can be cached for a day.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Baseline hardening. A strict Content-Security-Policy is deliberately
    # omitted: the pages rely on inline scripts and several third-party CDNs,
    # so a policy would have to be written and tested against every page.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Keep nginx logs useful without leaking query strings.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
